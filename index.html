<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMIGO — эфирная галерея</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c0c12;
            color: #ededee;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* контейнер */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 32px 100px;
        }

        /* заголовок + описание категории */
        .hero {
            margin-bottom: 60px;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 500;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 16px;
        }

        .category-desc {
            font-size: 1rem;
            line-height: 1.5;
            color: #a0a0b0;
            max-width: 600px;
            margin: 0 auto;
            transition: opacity 0.3s ease;
            font-weight: 300;
        }

        /* навигация */
        .nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 56px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.1);
            padding: 8px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 450;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            color: #bbb;
            font-family: inherit;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: #ffffff;
            color: #0c0c12;
            border-color: #ffffff;
        }

        /* сетка — плавная, с анимацией */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .card {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            background: #1a1a22;
            aspect-ratio: 4 / 5;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            will-change: transform;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease, filter 0.3s;
            filter: brightness(0.92) saturate(1.02);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
        }

        .card:hover img {
            transform: scale(1.03);
            filter: brightness(1) saturate(1.05);
        }

        /* подпись внутри карточки (номер) */
        .card-label {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-family: monospace;
            color: #ddd;
            pointer-events: none;
        }

        /* лайтбокс */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(12,12,18,0.98);
            backdrop-filter: blur(30px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 16px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.2);
            width: 52px;
            height: 52px;
            border-radius: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
        }

        .lb-nav:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-50%) scale(1.05);
        }

        .lb-prev { left: 28px; }
        .lb-next { right: 28px; }

        .lb-close {
            position: absolute;
            top: 28px;
            right: 32px;
            background: rgba(255,255,255,0.05);
            border: 0.5px solid rgba(255,255,255,0.2);
            width: 48px;
            height: 48px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
        }

        .lb-counter {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-family: monospace;
        }

        /* скелетон-лоадер */
        .skeleton {
            background: linear-gradient(90deg, #1a1a22 0%, #2a2a32 50%, #1a1a22 100%);
            background-size: 200% 100%;
            animation: shimmer 1s infinite;
            border-radius: 24px;
            aspect-ratio: 4 / 5;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* анимация появления карточек */
        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: cardAppear 0.4s ease backwards;
        }

        /* адаптив */
        @media (max-width: 760px) {
            .container {
                padding: 24px 16px 80px;
            }
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .nav-btn {
                padding: 6px 18px;
                font-size: 12px;
            }
            .hero {
                margin-bottom: 40px;
            }
            .lb-nav {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }
            .lb-prev { left: 12px; }
            .lb-next { right: 12px; }
        }

        footer {
            text-align: center;
            margin-top: 80px;
            font-size: 12px;
            color: #4a4a55;
            border-top: 0.5px solid rgba(255,255,255,0.05);
            padding-top: 32px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="hero">
        <h1>AMIGO</h1>
        <div class="category-desc" id="categoryDesc">
            вселенная в каждом кадре
        </div>
    </div>

    <div class="nav" id="nav">
        <button class="nav-btn active" data-filter="all">все</button>
        <button class="nav-btn" data-filter="architecture">архитектура</button>
        <button class="nav-btn" data-filter="nature">природа</button>
        <button class="nav-btn" data-filter="details">детали</button>
    </div>

    <div class="gallery" id="gallery"></div>
    <footer>amigo photos / эфирная коллекция</footer>
</div>

<div class="lightbox" id="lightbox">
    <div class="lb-close" id="lbClose">✕</div>
    <div class="lb-nav lb-prev" id="lbPrev">←</div>
    <div class="lb-nav lb-next" id="lbNext">→</div>
    <img id="lbImg" src="">
    <div class="lb-counter" id="lbCounter"></div>
</div>

<script>
    // ==========================================
    // ДАННЫЕ + ЖИВЫЕ ОПИСАНИЯ КАТЕГОРИЙ
    // ==========================================
    const PHOTOS = [
        { id: 1, cat: 'architecture' }, { id: 3, cat: 'architecture' }, { id: 4, cat: 'architecture' },
        { id: 6, cat: 'architecture' }, { id: 9, cat: 'architecture' }, { id: 10, cat: 'architecture' },
        { id: 13, cat: 'architecture' }, { id: 14, cat: 'architecture' }, { id: 15, cat: 'architecture' }, { id: 18, cat: 'architecture' },
        { id: 2, cat: 'nature' }, { id: 7, cat: 'nature' }, { id: 8, cat: 'nature' }, { id: 11, cat: 'nature' },
        { id: 16, cat: 'nature' }, { id: 17, cat: 'nature' }, { id: 19, cat: 'nature' }, { id: 20, cat: 'nature' }, { id: 21, cat: 'nature' },
        { id: 25, cat: 'nature' }, { id: 26, cat: 'nature' }, { id: 27, cat: 'nature' }, { id: 28, cat: 'nature' },
        { id: 29, cat: 'nature' }, { id: 30, cat: 'nature' }, { id: 31, cat: 'nature' }, { id: 32, cat: 'nature' },
        { id: 5, cat: 'details' }, { id: 12, cat: 'details' }, { id: 22, cat: 'details' }, { id: 23, cat: 'details' }, { id: 24, cat: 'details' }
    ];

    const DESCRIPTIONS = {
        all: 'вселенная в каждом кадре · 32 истории, 32 дыхания',
        architecture: 'каменная поэзия · линии, уходящие в небо · застывшая музыка',
        nature: 'земля дышит · ветер целует листья · вода танцует с луной',
        details: 'магия в малом · пыльца на лепестке · трещина как улыбка времени'
    };

    let currentFilter = 'all';
    let currentDisplay = [...PHOTOS];
    let currentIndex = 0;

    const galleryEl = document.getElementById('gallery');
    const descEl = document.getElementById('categoryDesc');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbCounter = document.getElementById('lbCounter');

    // ==========================================
    // ФУНКЦИЯ РЕНДЕРА С АНИМАЦИЕЙ И СКЕЛЕТОНАМИ
    // ==========================================
    function renderGallery(photos) {
        // показываем скелетоны
        galleryEl.innerHTML = '';
        for (let i = 0; i < photos.length; i++) {
            const skeleton = document.createElement('div');
            skeleton.className = 'skeleton';
            skeleton.style.animationDelay = `${i * 0.02}s`;
            galleryEl.appendChild(skeleton);
        }
        
        // загружаем реальные фото
        setTimeout(() => {
            const newCards = [];
            photos.forEach((photo, idx) => {
                const img = new Image();
                img.src = `images/${photo.id}.jpg`;
                img.onload = () => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.animationDelay = `${idx * 0.03}s`;
                    const image = document.createElement('img');
                    image.src = `images/${photo.id}.jpg`;
                    image.alt = `amigo ${photo.id}`;
                    image.onclick = () => openLightbox(PHOTOS.findIndex(p => p.id === photo.id));
                    
                    const label = document.createElement('div');
                    label.className = 'card-label';
                    label.innerText = `${photo.cat} / ${photo.id}`;
                    
                    card.appendChild(image);
                    card.appendChild(label);
                    
                    // заменяем скелетон
                    const skeletonEl = galleryEl.children[idx];
                    if (skeletonEl && skeletonEl.classList.contains('skeleton')) {
                        galleryEl.replaceChild(card, skeletonEl);
                    }
                };
            });
        }, 80);
    }

    function filterCategory(category) {
        currentFilter = category;
        // обновляем описание с анимацией
        descEl.style.opacity = '0';
        setTimeout(() => {
            descEl.innerText = DESCRIPTIONS[category] || DESCRIPTIONS.all;
            descEl.style.opacity = '1';
        }, 150);
        
        if (category === 'all') {
            currentDisplay = [...PHOTOS];
        } else {
            currentDisplay = PHOTOS.filter(p => p.cat === category);
        }
        renderGallery(currentDisplay);
    }

    // ==========================================
    // ЛАЙТБОКС
    // ==========================================
    function openLightbox(index) {
        currentIndex = index;
        const photo = PHOTOS[currentIndex];
        lbImg.src = `images/${photo.id}.jpg`;
        lbCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        document.body.style.overflow = '';
    }

    function nextImage() {
        currentIndex = (currentIndex + 1) % PHOTOS.length;
        lbImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        lbCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    function prevImage() {
        currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length;
        lbImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        lbCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    // ==========================================
    // СОБЫТИЯ
    // ==========================================
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterCategory(btn.dataset.filter);
        });
    });

    document.getElementById('lbClose').onclick = closeLightbox;
    document.getElementById('lbPrev').onclick = prevImage;
    document.getElementById('lbNext').onclick = nextImage;
    lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };
    document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        }
    });

    // ПРЕДЗАГРУЗКА ПЕРВЫХ 12 ФОТО
    for (let i = 0; i < Math.min(12, PHOTOS.length); i++) {
        const pre = new Image();
        pre.src = `images/${PHOTOS[i].id}.jpg`;
    }

    // СТАРТ
    renderGallery(PHOTOS);
</script>
</body>
</html>
