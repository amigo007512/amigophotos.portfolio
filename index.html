<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AMIGO — каскад фрагментов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #03030c;
            font-family: 'Inter', 'SF Pro Text', system-ui, sans-serif;
            overflow-x: hidden;
            color: #fff;
            min-height: 100vh;
        }

        /* Анимированный фон — абстрактные волны */
        canvas#fluid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Основной контент */
        .content {
            position: relative;
            z-index: 2;
            padding: 30px 24px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* шапка */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 60px;
            font-size: 13px;
            letter-spacing: 2px;
            color: #aaa;
            border-bottom: 0.5px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }

        /* заголовок с анимацией появления */
        .hero {
            text-align: center;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(40px);
            animation: heroAppear 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        @keyframes heroAppear {
            to { opacity: 1; transform: translateY(0); }
        }
        .hero h1 {
            font-size: clamp(48px, 10vw, 110px);
            font-weight: 500;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, #aaccff, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 8s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero p {
            font-size: 14px;
            letter-spacing: 3px;
            color: #88aaff;
            margin-top: 16px;
        }

        /* кнопки категорий с анимацией */
        .filters {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 70px;
            flex-wrap: wrap;
            opacity: 0;
            animation: filtersAppear 0.6s 0.2s forwards;
        }
        @keyframes filtersAppear {
            to { opacity: 1; }
        }
        .filter {
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            color: #aaa;
            cursor: pointer;
            transition: 0.2s;
            font-family: monospace;
            padding: 6px 0;
            position: relative;
        }
        .filter::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: 0.25s;
        }
        .filter:hover::after, .filter.active::after {
            width: 100%;
        }
        .filter.active {
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* КОНТЕЙНЕР ДЛЯ ХАОТИЧНЫХ ФОТО */
        .chaos-container {
            position: relative;
            min-height: 70vh;
            margin: 20px 0;
        }

        /* каждая фотография — абсолютная, со случайной позицией */
        .chaos-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.4, 1.2);
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.4));
            will-change: transform, opacity;
            opacity: 0;
            transform: scale(0.8) rotate(var(--rot, 0deg));
            animation: chaosAppear 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            animation-delay: calc(var(--i, 0) * 0.03s);
        }
        @keyframes chaosAppear {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(calc(var(--rot, 0deg) - 10deg));
            }
            60% {
                opacity: 1;
                transform: scale(1.02) rotate(calc(var(--rot, 0deg) + 2deg));
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(var(--rot, 0deg));
            }
        }

        .chaos-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            transition: transform 0.3s;
            filter: grayscale(0.15) brightness(0.9);
        }
        .chaos-item:hover {
            z-index: 100;
            transform: scale(1.05) rotate(0deg) !important;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        }
        .chaos-item:hover img {
            filter: grayscale(0) brightness(1.05);
        }

        /* подпись внутри */
        .chaos-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 10px;
            font-family: monospace;
            color: #ddd;
            pointer-events: none;
        }

        /* Лайтбокс */
        .portal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            backdrop-filter: blur(40px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            cursor: pointer;
        }
        .portal img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 12px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }
        .portal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.05);
            width: 56px;
            height: 56px;
            border-radius: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: 0.2s;
        }
        .portal-nav:hover { background: rgba(255,255,255,0.15); }
        .portal-prev { left: 28px; }
        .portal-next { right: 28px; }
        .portal-close {
            position: absolute;
            top: 28px;
            right: 32px;
            background: rgba(255,255,255,0.05);
            width: 48px;
            height: 48px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .portal-counter {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
        }

        /* Адаптив */
        @media (max-width: 800px) {
            .chaos-item {
                width: 140px !important;
            }
        }
        @media (max-width: 550px) {
            .chaos-item {
                width: 110px !important;
            }
            .filters { gap: 16px; }
            .filter { font-size: 10px; }
        }

        footer {
            text-align: center;
            margin-top: 100px;
            font-size: 10px;
            color: #2a2a3a;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<canvas id="fluid"></canvas>

<div class="content">
    <div class="top">
        <span>AMIGO</span>
        <span>20</span>
    </div>
    <div class="hero">
        <h1>fragment cascade</h1>
        <p>— chaos of frames —</p>
    </div>
    <div class="filters" id="filters">
        <button class="filter active" data-filter="all">all</button>
        <button class="filter" data-filter="architecture">architecture</button>
        <button class="filter" data-filter="nature">nature</button>
        <button class="filter" data-filter="details">details</button>
    </div>
    <div class="chaos-container" id="chaosContainer"></div>
    <footer>amigo / 20 лет / кинетический хаос</footer>
</div>

<div class="portal" id="portal">
    <div class="portal-close" id="portalClose">✕</div>
    <div class="portal-nav portal-prev" id="portalPrev">←</div>
    <div class="portal-nav portal-next" id="portalNext">→</div>
    <img id="portalImg" src="">
    <div class="portal-counter" id="portalCounter"></div>
</div>

<script>
    // ==========================================
    // ФОТОГРАФИИ (все 32)
    // ==========================================
    const PHOTOS = [
        { id: 1, cat: 'architecture' }, { id: 3, cat: 'architecture' }, { id: 4, cat: 'architecture' },
        { id: 6, cat: 'architecture' }, { id: 9, cat: 'architecture' }, { id: 10, cat: 'architecture' },
        { id: 13, cat: 'architecture' }, { id: 14, cat: 'architecture' }, { id: 15, cat: 'architecture' }, { id: 18, cat: 'architecture' },
        { id: 2, cat: 'nature' }, { id: 7, cat: 'nature' }, { id: 8, cat: 'nature' }, { id: 11, cat: 'nature' },
        { id: 16, cat: 'nature' }, { id: 17, cat: 'nature' }, { id: 19, cat: 'nature' }, { id: 20, cat: 'nature' }, { id: 21, cat: 'nature' },
        { id: 25, cat: 'nature' }, { id: 26, cat: 'nature' }, { id: 27, cat: 'nature' }, { id: 28, cat: 'nature' },
        { id: 29, cat: 'nature' }, { id: 30, cat: 'nature' }, { id: 31, cat: 'nature' }, { id: 32, cat: 'nature' },
        { id: 5, cat: 'details' }, { id: 12, cat: 'details' }, { id: 22, cat: 'details' }, { id: 23, cat: 'details' }, { id: 24, cat: 'details' }
    ];

    let currentFilter = 'all';
    let currentDisplay = [...PHOTOS];
    let currentIndex = 0;

    const container = document.getElementById('chaosContainer');
    const portal = document.getElementById('portal');
    const portalImg = document.getElementById('portalImg');
    const portalCounter = document.getElementById('portalCounter');

    // ==========================================
    // АНИМИРОВАННЫЙ ФОН (жидкость)
    // ==========================================
    const canvas = document.getElementById('fluid');
    const ctx = canvas.getContext('2d');
    let w, h;
    let time = 0;
    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
    }
    window.addEventListener('resize', resize);
    resize();

    function drawFluid() {
        if (!ctx) return;
        ctx.fillStyle = '#03030c';
        ctx.fillRect(0, 0, w, h);
        // абстрактные волны
        for (let i = 0; i < 6; i++) {
            ctx.beginPath();
            for (let x = 0; x < w; x += 30) {
                const y = h/2 + Math.sin(x * 0.008 + time) * 50 + Math.cos(x * 0.02 + time * 0.5) * 30;
                if (x === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = `rgba(100,150,255,${0.05 + Math.sin(time) * 0.02})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        // плавающие частицы
        for (let i = 0; i < 80; i++) {
            const x = (Math.sin(time * 0.2 + i) * 0.5 + 0.5) * w;
            const y = (Math.cos(time * 0.3 + i * 2) * 0.4 + 0.5) * h;
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255,255,255,${0.1 + Math.sin(time + i) * 0.05})`;
            ctx.fill();
        }
        time += 0.02;
        requestAnimationFrame(drawFluid);
    }
    drawFluid();

    // ==========================================
    // ГЕНЕРАЦИЯ СЛУЧАЙНЫХ ПОЗИЦИЙ (хаос)
    // ==========================================
    function getRandomPositions(count, containerRect) {
        const positions = [];
        const margin = 20;
        const maxAttempts = 200;
        for (let i = 0; i < count; i++) {
            let attempts = 0;
            let placed = false;
            let size = 180 + Math.random() * 100; // ширина от 180 до 280px
            let rot = (Math.random() - 0.5) * 12; // вращение от -6 до +6 градусов
            while (!placed && attempts < maxAttempts) {
                let left = margin + Math.random() * (containerRect.width - size - margin*2);
                let top = margin + Math.random() * (containerRect.height - size - margin*2);
                let overlap = false;
                for (let p of positions) {
                    const dx = Math.abs(p.left - left);
                    const dy = Math.abs(p.top - top);
                    if (dx < (p.size + size)/1.5 && dy < (p.size + size)/1.5) {
                        overlap = true;
                        break;
                    }
                }
                if (!overlap) {
                    positions.push({ left, top, size, rot });
                    placed = true;
                }
                attempts++;
            }
            if (!placed) {
                positions.push({ left: margin + Math.random() * (containerRect.width - size - margin*2),
                                 top: margin + Math.random() * (containerRect.height - size - margin*2),
                                 size, rot });
            }
        }
        return positions;
    }

    // ==========================================
    // РЕНДЕР ХАОТИЧНОЙ ГАЛЕРЕИ
    // ==========================================
    function renderChaos(photos) {
        const rect = container.getBoundingClientRect();
        if (rect.width === 0) {
            setTimeout(() => renderChaos(photos), 50);
            return;
        }
        const positions = getRandomPositions(photos.length, rect);
        container.innerHTML = '';
        container.style.height = Math.max(rect.height, 600) + 'px';
        
        photos.forEach((photo, idx) => {
            const pos = positions[idx];
            const div = document.createElement('div');
            div.className = 'chaos-item';
            div.style.left = pos.left + 'px';
            div.style.top = pos.top + 'px';
            div.style.width = pos.size + 'px';
            div.style.height = pos.size * 0.8 + 'px';
            div.style.setProperty('--rot', pos.rot + 'deg');
            div.style.setProperty('--i', idx);
            
            const img = document.createElement('img');
            img.src = `images/${photo.id}.jpg`;
            img.alt = `amigo_${photo.id}`;
            img.onclick = () => openPortal(PHOTOS.findIndex(p => p.id === photo.id));
            
            const label = document.createElement('div');
            label.className = 'chaos-label';
            label.innerText = `${photo.cat} / ${photo.id}`;
            
            div.appendChild(img);
            div.appendChild(label);
            container.appendChild(div);
        });
    }

    function filterCategory(category) {
        currentFilter = category;
        if (category === 'all') currentDisplay = [...PHOTOS];
        else currentDisplay = PHOTOS.filter(p => p.cat === category);
        renderChaos(currentDisplay);
    }

    // ==========================================
    // ПОРТАЛ
    // ==========================================
    function openPortal(index) {
        currentIndex = index;
        portalImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
        portal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }
    function closePortal() {
        portal.style.display = 'none';
        document.body.style.overflow = '';
    }
    function next() {
        currentIndex = (currentIndex + 1) % PHOTOS.length;
        portalImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }
    function prev() {
        currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length;
        portalImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    // ==========================================
    // СОБЫТИЯ + РЕСАЙЗ
    // ==========================================
    let resizeTimeout;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            renderChaos(currentDisplay);
        }, 200);
    });

    document.querySelectorAll('.filter').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterCategory(btn.dataset.filter);
        });
    });

    document.getElementById('portalClose').onclick = closePortal;
    document.getElementById('portalPrev').onclick = prev;
    document.getElementById('portalNext').onclick = next;
    portal.onclick = (e) => { if (e.target === portal) closePortal(); };
    document.addEventListener('keydown', (e) => {
        if (portal.style.display === 'flex') {
            if (e.key === 'Escape') closePortal();
            if (e.key === 'ArrowLeft') prev();
            if (e.key === 'ArrowRight') next();
        }
    });

    // предзагрузка
    for (let i = 0; i < Math.min(12, PHOTOS.length); i++) {
        new Image().src = `images/${PHOTOS[i].id}.jpg`;
    }

    // запуск
    renderChaos(PHOTOS);
</script>
</body>
</html>
