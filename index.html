<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMIGO — photo alchemy</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f8f6;
            color: #1a1a1a;
            font-family: 'Times New Roman', 'SF Pro Text', -apple-system, 'Helvetica Neue', serif;
            font-weight: 400;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
        }

        /* smooth scroll */
        html {
            scroll-behavior: smooth;
        }

        /* container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
        }

        /* header — как в фотоальбомах Leica */
        .header {
            padding: 48px 0 32px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            margin-bottom: 48px;
        }

        .logo {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 400;
            color: #2c2c2c;
        }

        .logo sup {
            font-size: 8px;
            letter-spacing: 0;
        }

        /* hero — кинематографичный */
        .hero {
            margin-bottom: 80px;
            position: relative;
        }

        .hero-image {
            width: 100%;
            height: 70vh;
            object-fit: cover;
            filter: grayscale(0.15);
        }

        .hero-caption {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
        }

        /* навигация — минималистичная */
        .nav {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-bottom: 56px;
            flex-wrap: wrap;
            border-bottom: 0.5px solid rgba(0,0,0,0.08);
            padding-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            padding: 8px 28px;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: inherit;
            cursor: pointer;
            color: #999;
            transition: all 0.2s ease;
            font-weight: 400;
        }

        .nav-btn:hover {
            color: #1a1a1a;
        }

        .nav-btn.active {
            color: #1a1a1a;
            position: relative;
        }

        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: -21px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 1px;
            background: #1a1a1a;
        }

        /* галерея — как в премиум фотоальбомах */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 32px;
            margin-bottom: 100px;
        }

        .gallery-item {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-item img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            display: block;
            transition: opacity 0.4s ease;
            filter: grayscale(0.05);
        }

        .gallery-item:hover img {
            opacity: 0.92;
        }

        .item-info {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #666;
            border-top: 0.5px solid rgba(0,0,0,0.05);
            padding-top: 14px;
        }

        .item-cat {
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 1px;
        }

        .item-id {
            font-family: monospace;
            font-size: 11px;
        }

        /* особые размеры для драматизма */
        .gallery-item:nth-child(2),
        .gallery-item:nth-child(7),
        .gallery-item:nth-child(13) {
            transform: translateY(20px);
        }

        .gallery-item:nth-child(5),
        .gallery-item:nth-child(11),
        .gallery-item:nth-child(18) {
            transform: translateY(-15px);
        }

        /* лайтбокс — как просмотр фотоальбома */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(248,248,246,0.98);
            backdrop-filter: blur(20px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 85%;
            object-fit: contain;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.03);
            width: 52px;
            height: 52px;
            border-radius: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            color: #1a1a1a;
        }

        .lightbox-nav:hover {
            background: rgba(0,0,0,0.08);
        }

        .lightbox-prev { left: 32px; }
        .lightbox-next { right: 32px; }

        .lightbox-close {
            position: absolute;
            top: 32px;
            right: 32px;
            background: rgba(0,0,0,0.03);
            width: 48px;
            height: 48px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(0,0,0,0.08);
        }

        .lightbox-counter {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 2px;
            color: #aaa;
            background: rgba(0,0,0,0.03);
            padding: 6px 20px;
            border-radius: 40px;
            font-family: monospace;
        }

        /* кнопка наверх */
        #toTop {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #1a1a1a;
            color: #f8f8f6;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 44px;
            cursor: pointer;
            display: none;
            z-index: 99;
            font-size: 18px;
            transition: all 0.2s;
            font-family: monospace;
        }

        #toTop:hover {
            transform: translateY(-2px);
            background: #333;
        }

        /* footer */
        .footer {
            border-top: 0.5px solid rgba(0,0,0,0.08);
            padding: 48px 32px 64px;
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
            color: #aaa;
            text-transform: uppercase;
        }

        /* анимация появления */
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-item {
            animation: appear 0.6s ease backwards;
        }

        /* адаптив */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 28px;
            }
            .container {
                padding: 0 20px;
            }
            .hero-image {
                height: 50vh;
            }
            .gallery-item:nth-child(2),
            .gallery-item:nth-child(7),
            .gallery-item:nth-child(13),
            .gallery-item:nth-child(5),
            .gallery-item:nth-child(11),
            .gallery-item:nth-child(18) {
                transform: none;
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .nav-btn {
                padding: 6px 16px;
                font-size: 11px;
            }
            .nav-btn.active::after {
                bottom: -19px;
            }
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .lightbox-prev { left: 12px; }
            .lightbox-next { right: 12px; }
        }

        /* скелетон */
        .skeleton {
            background: #e8e8e6;
            aspect-ratio: 4 / 5;
            width: 100%;
            border-radius: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">AMIGO <sup>®</sup></div>
    </div>

    <div class="hero">
        <img class="hero-image" id="heroImage" src="images/1.jpg" alt="hero">
        <div class="hero-caption">THE ARCHIVE — VOL.1</div>
    </div>

    <div class="nav" id="nav">
        <button class="nav-btn active" data-filter="all">All</button>
        <button class="nav-btn" data-filter="architecture">Architecture</button>
        <button class="nav-btn" data-filter="nature">Nature</button>
        <button class="nav-btn" data-filter="details">Details</button>
    </div>

    <div class="gallery" id="gallery"></div>
</div>

<div class="footer">
    <p>AMIGO PHOTOS — analogue spirit / digital soul</p>
</div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightboxClose">✕</div>
    <div class="lightbox-nav lightbox-prev" id="lightboxPrev">←</div>
    <div class="lightbox-nav lightbox-next" id="lightboxNext">→</div>
    <img id="lightboxImg" src="">
    <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<button id="toTop">↑</button>

<script>
    // ==================================================
    // ФОТОГРАФИИ
    // ==================================================
    const PHOTOS = [
        { id: 1, cat: 'architecture' }, { id: 3, cat: 'architecture' }, { id: 4, cat: 'architecture' },
        { id: 6, cat: 'architecture' }, { id: 9, cat: 'architecture' }, { id: 10, cat: 'architecture' },
        { id: 13, cat: 'architecture' }, { id: 14, cat: 'architecture' }, { id: 15, cat: 'architecture' }, { id: 18, cat: 'architecture' },
        { id: 2, cat: 'nature' }, { id: 7, cat: 'nature' }, { id: 8, cat: 'nature' }, { id: 11, cat: 'nature' },
        { id: 16, cat: 'nature' }, { id: 17, cat: 'nature' }, { id: 19, cat: 'nature' }, { id: 20, cat: 'nature' }, { id: 21, cat: 'nature' },
        { id: 25, cat: 'nature' }, { id: 26, cat: 'nature' }, { id: 27, cat: 'nature' }, { id: 28, cat: 'nature' },
        { id: 29, cat: 'nature' }, { id: 30, cat: 'nature' }, { id: 31, cat: 'nature' }, { id: 32, cat: 'nature' },
        { id: 5, cat: 'details' }, { id: 12, cat: 'details' }, { id: 22, cat: 'details' }, { id: 23, cat: 'details' }, { id: 24, cat: 'details' }
    ];

    let currentFilter = 'all';
    let currentIndex = 0;
    let currentDisplay = [...PHOTOS];

    const galleryDiv = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCounter = document.getElementById('lightboxCounter');
    const heroImage = document.getElementById('heroImage');

    // ==================================================
    // ГАЛЕРЕЯ
    // ==================================================
    function renderGallery(photos) {
        galleryDiv.style.opacity = '0';
        setTimeout(() => {
            galleryDiv.innerHTML = '';
            photos.forEach((photo, idx) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.style.animationDelay = `${idx * 0.03}s`;
                
                const img = document.createElement('img');
                img.loading = idx < 9 ? 'eager' : 'lazy';
                img.decoding = 'async';
                img.src = `images/${photo.id}.jpg`;
                img.alt = `amigo ${photo.id}`;
                img.onclick = () => openLightbox(PHOTOS.findIndex(p => p.id === photo.id));
                
                const info = document.createElement('div');
                info.className = 'item-info';
                info.innerHTML = `
                    <span class="item-cat">${photo.cat}</span>
                    <span class="item-id">${String(photo.id).padStart(2, '0')}</span>
                `;
                
                item.appendChild(img);
                item.appendChild(info);
                galleryDiv.appendChild(item);
            });
            galleryDiv.style.opacity = '1';
        }, 150);
    }

    function filterGallery(category) {
        if (category === 'all') {
            currentDisplay = [...PHOTOS];
        } else {
            currentDisplay = PHOTOS.filter(p => p.cat === category);
        }
        renderGallery(currentDisplay);
    }

    // ==================================================
    // ЛАЙТБОКС
    // ==================================================
    function openLightbox(index) {
        currentIndex = index;
        const photo = PHOTOS[currentIndex];
        lightboxImg.src = `images/${photo.id}.jpg`;
        lightboxCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.style.display = 'none';
        document.body.style.overflow = '';
    }

    function nextImage() {
        currentIndex = (currentIndex + 1) % PHOTOS.length;
        lightboxImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        lightboxCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    function prevImage() {
        currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length;
        lightboxImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        lightboxCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    // ==================================================
    // СОБЫТИЯ
    // ==================================================
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            filterGallery(currentFilter);
        };
    });

    document.getElementById('lightboxClose').onclick = closeLightbox;
    document.getElementById('lightboxPrev').onclick = prevImage;
    document.getElementById('lightboxNext').onclick = nextImage;
    lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };
    document.addEventListener('keydown', (e) => {
        if (lightbox.style.display === 'flex') {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage();
            if (e.key === 'ArrowRight') nextImage();
        }
    });

    // кнопка наверх
    const toTop = document.getElementById('toTop');
    window.addEventListener('scroll', () => {
        toTop.style.display = window.scrollY > 500 ? 'flex' : 'none';
    });
    toTop.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // меняем hero-фото случайно раз в 8 секунд
    let heroIndex = 0;
    const heroImages = [1, 5, 9, 14, 22, 28];
    setInterval(() => {
        heroIndex = (heroIndex + 1) % heroImages.length;
        heroImage.style.opacity = '0.5';
        setTimeout(() => {
            heroImage.src = `images/${heroImages[heroIndex]}.jpg`;
            heroImage.style.opacity = '1';
        }, 200);
    }, 8000);

    // старт
    renderGallery(PHOTOS);
</script>

<!-- Service Worker для офлайн -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {
            const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('offline'))));`;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(blob));
        });
    }
</script>
</body>
</html>
