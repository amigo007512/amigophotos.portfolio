<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Photos | Liquid Glass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #000000);
            color: #fff;
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
        }

        /* Liquid Glass Hero */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .glass-title {
            font-size: clamp(48px, 10vw, 120px);
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a855f7 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .glass-subtitle {
            font-size: 18px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-top: 24px;
        }

        /* Liquid Glass Navigation */
        .liquid-nav {
            position: sticky;
            top: 24px;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 80px;
            width: fit-content;
            margin: 0 auto 40px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .liquid-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 10px 32px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .liquid-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .liquid-btn:hover::before {
            left: 100%;
        }

        .liquid-btn:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .liquid-btn.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* Gallery */
        .gallery {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 28px;
        }

        .gallery-item {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            aspect-ratio: 4 / 5;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(168,85,247,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(168,85,247,0.3);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(40px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .lightbox-close {
            position: absolute;
            top: 28px;
            right: 32px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            width: 52px;
            height: 52px;
            border-radius: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lightbox-close:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                padding: 20px 16px 60px;
            }
            .liquid-nav {
                top: 16px;
                padding: 8px 16px;
                gap: 8px;
            }
            .liquid-btn {
                padding: 6px 18px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<section class="hero">
    <h1 class="glass-title">Amigo Photos</h1>
    <p class="glass-subtitle">Liquid Vision · Eternal Frames</p>
</section>

<div class="liquid-nav">
    <button class="liquid-btn active" data-filter="all">∞ All</button>
    <button class="liquid-btn" data-filter="architecture">⌂ Architecture</button>
    <button class="liquid-btn" data-filter="nature">🌿 Nature</button>
    <button class="liquid-btn" data-filter="details">🔍 Details</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
    <div class="lightbox-close">✕</div>
    <img id="lightboxImg" src="">
</div>

<script>
    const PHOTOS = [
        { id: 1, cat: 'architecture' }, { id: 3, cat: 'architecture' }, { id: 4, cat: 'architecture' },
        { id: 6, cat: 'architecture' }, { id: 9, cat: 'architecture' }, { id: 10, cat: 'architecture' },
        { id: 13, cat: 'architecture' }, { id: 14, cat: 'architecture' }, { id: 15, cat: 'architecture' }, { id: 18, cat: 'architecture' },
        { id: 2, cat: 'nature' }, { id: 7, cat: 'nature' }, { id: 8, cat: 'nature' }, { id: 11, cat: 'nature' },
        { id: 16, cat: 'nature' }, { id: 17, cat: 'nature' }, { id: 19, cat: 'nature' }, { id: 20, cat: 'nature' }, { id: 21, cat: 'nature' },
        { id: 25, cat: 'nature' }, { id: 26, cat: 'nature' }, { id: 27, cat: 'nature' }, { id: 28, cat: 'nature' },
        { id: 29, cat: 'nature' }, { id: 30, cat: 'nature' }, { id: 31, cat: 'nature' }, { id: 32, cat: 'nature' },
        { id: 5, cat: 'details' }, { id: 12, cat: 'details' }, { id: 22, cat: 'details' }, { id: 23, cat: 'details' }, { id: 24, cat: 'details' }
    ];

    let currentFilter = 'all';
    const galleryDiv = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    function renderGallery(photos) {
        galleryDiv.innerHTML = '';
        photos.forEach(photo => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = `images/${photo.id}.jpg`;
            img.alt = `Amigo ${photo.id}`;
            img.onclick = () => {
                lightboxImg.src = `images/${photo.id}.jpg`;
                lightbox.style.display = 'flex';
            };
            item.appendChild(img);
            galleryDiv.appendChild(item);
        });
    }

    function filterGallery(category) {
        const filtered = category === 'all' ? PHOTOS : PHOTOS.filter(p => p.cat === category);
        renderGallery(filtered);
    }

    document.querySelectorAll('.liquid-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.liquid-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            filterGallery(currentFilter);
        };
    });

    document.querySelector('.lightbox-close').onclick = () => lightbox.style.display = 'none';
    lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.style.display = 'none'; };

    renderGallery(PHOTOS);
</script>
</body>
</html>
