<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2D4VS5FRD"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Photos — фотопортфолио</title>
    
    <meta name="description" content="Фотопортфолио Amigo Photos. Архитектура, природа и детали в объективе.">
    <meta name="keywords" content="фотография, портфолио, архитектура, природа, детали, Amigo Photos">
    <meta name="author" content="Amigo Photos">
    <meta property="og:title" content="Amigo Photos — фотопортфолио">
    <meta property="og:description" content="Архитектура, природа и детали в объективе.">
    <meta property="og:image" content="https://амигоботов.portfolio/images/1.jpg">
    <meta property="og:type" content="website">
    
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0e0e0e;
            color: #fff;
        }
        
        /* Hero слайдер */
        .hero {
            height: 85vh;
            position: relative;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .hero h1 {
            font-size: 4em;
            margin: 0;
        }
        
        .hero p {
            margin-top: 15px;
            font-size: 1.2em;
        }
        
        /* Категории */
        .categories {
            padding: 30px 60px 0;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .category-btn {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 10px 24px;
            margin: 5px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .category-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }
        
        .category-btn.active {
            background: #fff;
            color: #000;
        }
        
        /* Галерея */
        .gallery {
            display: grid;
            gap: 20px;
            padding: 40px 60px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        
        .gallery-item {
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s;
        }
        
        .gallery-item:hover img {
            transform: scale(1.03);
        }
        
        /* Лайтбокс */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        #lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 10px;
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            font-size: 40px;
            padding: 20px 15px;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 1001;
        }
        
        .lightbox-nav:hover {
            background: rgba(255,255,255,0.4);
        }
        
        .lightbox-prev {
            left: 20px;
        }
        
        .lightbox-next {
            right: 20px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }
        
        /* Кнопка наверх */
        #toTop {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            z-index: 99;
        }
        
        /* Адаптив */
        @media (max-width: 768px) {
            .hero {
                height: 60vh;
            }
            .hero h1 {
                font-size: 2em;
            }
            .hero p {
                font-size: 1em;
            }
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                padding: 20px 12px;
                gap: 8px;
            }
            .gallery img {
                height: 170px;
            }
            .categories {
                padding: 20px 12px 0;
            }
            .category-btn {
                padding: 6px 16px;
                font-size: 12px;
            }
            .lightbox-nav {
                font-size: 25px;
                padding: 10px;
            }
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="slide active" style="background-image: url('images/1.jpg');"></div>
    <div class="slide" style="background-image: url('images/2.jpg');"></div>
    <div class="slide" style="background-image: url('images/3.jpg');"></div>
    <div class="slide" style="background-image: url('images/4.jpg');"></div>
    <div class="slide" style="background-image: url('images/5.jpg');"></div>
    <div class="hero-content">
        <h1>Amigo Photos</h1>
        <p>Архитектура · Природа · Детали</p>
        <p>Фотография — способ сохранить моменты</p>
    </div>
</section>

<div class="categories" id="categories"></div>

<section class="gallery" id="gallery"></section>

<div id="lightbox">
    <button class="lightbox-close">✕</button>
    <button class="lightbox-nav lightbox-prev">❮</button>
    <button class="lightbox-nav lightbox-next">❯</button>
    <img src="">
</div>

<button id="toTop">↑ Наверх</button>

<footer>
    © 2026 Amigo Photos — All Rights Reserved
</footer>

<script>
// ========================================
// КАТЕГОРИИ (можно легко менять и добавлять)
// ========================================
const CATEGORIES = {
    all: { name: '📷 Все', icon: '📷' },
    architecture: { name: '🏛️ Архитектура', icon: '🏛️' },
    nature: { name: '🌿 Природа', icon: '🌿' },
    details: { name: '🔍 Детали', icon: '🔍' }
};

// ========================================
// ФОТО С КАТЕГОРИЯМИ (добавляй новые сюда)
// ========================================
const photosData = [
    // АРХИТЕКТУРА (10 фото)
    { id: 1, src: 'images/1.jpg', category: 'architecture' },
    { id: 3, src: 'images/3.jpg', category: 'architecture' },
    { id: 4, src: 'images/4.jpg', category: 'architecture' },
    { id: 6, src: 'images/6.jpg', category: 'architecture' },
    { id: 9, src: 'images/9.jpg', category: 'architecture' },
    { id: 10, src: 'images/10.jpg', category: 'architecture' },
    { id: 13, src: 'images/13.jpg', category: 'architecture' },
    { id: 14, src: 'images/14.jpg', category: 'architecture' },
    { id: 15, src: 'images/15.jpg', category: 'architecture' },
    { id: 18, src: 'images/18.jpg', category: 'architecture' },
    
    // ПРИРОДА (9 фото)
    { id: 2, src: 'images/2.jpg', category: 'nature' },
    { id: 7, src: 'images/7.jpg', category: 'nature' },
    { id: 8, src: 'images/8.jpg', category: 'nature' },
    { id: 11, src: 'images/11.jpg', category: 'nature' },
    { id: 16, src: 'images/16.jpg', category: 'nature' },
    { id: 17, src: 'images/17.jpg', category: 'nature' },
    { id: 19, src: 'images/19.jpg', category: 'nature' },
    { id: 20, src: 'images/20.jpg', category: 'nature' },
    { id: 21, src: 'images/21.jpg', category: 'nature' },
    
    // ДЕТАЛИ (4 фото)
    { id: 5, src: 'images/5.jpg', category: 'details' },
    { id: 12, src: 'images/12.jpg', category: 'details' },
    { id: 22, src: 'images/22.jpg', category: 'details' },
    { id: 23, src: 'images/23.jpg', category: 'details' }
];

// ========================================
// КОД (ничего не трогать)
// ========================================
const galleryContainer = document.getElementById('gallery');
const categoriesContainer = document.getElementById('categories');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
let currentPhotoIndex = 0;

// Создание кнопок категорий
function renderCategories() {
    const fragment = document.createDocumentFragment();
    
    Object.keys(CATEGORIES).forEach(catKey => {
        const btn = document.createElement('button');
        btn.className = 'category-btn';
        if (catKey === 'all') btn.classList.add('active');
        btn.setAttribute('data-category', catKey);
        btn.textContent = CATEGORIES[catKey].name;
        
        btn.addEventListener('click', () => {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery(catKey);
        });
        
        fragment.appendChild(btn);
    });
    
    categoriesContainer.appendChild(fragment);
}

// Отрисовка галереи
function renderGallery(category = 'all') {
    const filtered = category === 'all' 
        ? photosData 
        : photosData.filter(p => p.category === category);
    
    const fragment = document.createDocumentFragment();
    
    filtered.forEach((photo) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        const img = document.createElement('img');
        img.src = photo.src;
        img.alt = `Фото ${photo.id}`;
        
        img.addEventListener('click', () => {
            const globalIdx = photosData.findIndex(p => p.id === photo.id);
            openLightbox(globalIdx);
        });
        
        item.appendChild(img);
        fragment.appendChild(item);
    });
    
    galleryContainer.innerHTML = '';
    galleryContainer.appendChild(fragment);
}

// Лайтбокс
function openLightbox(index) {
    currentPhotoIndex = index;
    lightboxImg.src = photosData[currentPhotoIndex].src;
    lightbox.style.display = 'flex';
}

function closeLightbox() {
    lightbox.style.display = 'none';
}

function prevPhoto() {
    currentPhotoIndex = (currentPhotoIndex - 1 + photosData.length) % photosData.length;
    lightboxImg.src = photosData[currentPhotoIndex].src;
}

function nextPhoto() {
    currentPhotoIndex = (currentPhotoIndex + 1) % photosData.length;
    lightboxImg.src = photosData[currentPhotoIndex].src;
}

// Слайдер
let currentSlide = 0;
const slides = document.querySelectorAll('.slide');
let slideInterval;

function startSlider() {
    slideInterval = setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 5000);
}

startSlider();

// Кнопка наверх
const toTop = document.getElementById('toTop');
let scrollTimeout;

window.addEventListener('scroll', () => {
    if (scrollTimeout) return;
    scrollTimeout = setTimeout(() => {
        toTop.style.display = window.scrollY > 300 ? 'block' : 'none';
        scrollTimeout = null;
    }, 50);
});

toTop.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
});

// Инициализация
renderCategories();
renderGallery();

// События лайтбокса
document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
document.querySelector('.lightbox-prev').addEventListener('click', prevPhoto);
document.querySelector('.lightbox-next').addEventListener('click', nextPhoto);
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevPhoto();
        if (e.key === 'ArrowRight') nextPhoto();
    }
});
</script>

</body>
</html>
