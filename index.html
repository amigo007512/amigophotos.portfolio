<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIGO — фотоистории</title>

    <meta name="description" content="Премиальное портфолио Amigo Photos">

    <!-- preload hero -->
    <link rel="preload" as="image" href="images/1.jpg">

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="logo">AMIGO</div>
    <nav class="menu">
        <a href="#">Работы</a>
        <a href="#">Обо мне</a>
        <a href="#">Контакт</a>
    </nav>
</header>

<section class="hero">
    <img id="heroImage" src="images/1.jpg" alt="">
    <div class="hero-content">
        <h1>Визуальные нарративы</h1>
        <p>Архитектура · Природа · Детали</p>
    </div>
</section>

<div class="filter-bar">
    <button data-filter="all" class="active">Все</button>
    <button data-filter="architecture">Архитектура</button>
    <button data-filter="nature">Природа</button>
    <button data-filter="details">Детали</button>
</div>

<section id="gallery" class="gallery"></section>

<!-- Lightbox -->
<div id="lightbox">
    <button id="close">✕</button>
    <img id="lightboxImg">
</div>

<script src="js/data.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/app.js"></script>

</body>
</html>
