<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2D4VS5FRD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Photos — архитектура · природа · детали</title>
    
    <meta name="description" content="Фотопортфолио Amigo Photos. Архитектура, природа и детали в объективе. Работает офлайн!">
    <meta name="keywords" content="фотография, портфолио, архитектура, природа, детали">
    <meta name="author" content="Amigo Photos">
    <meta property="og:title" content="Amigo Photos — фотопортфолио">
    <meta property="og:description" content="Архитектура, природа и детали в объективе.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E<text y='.9em' font-size='90'>📷</text>%3C/svg%3E">
    
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0e0e0e;color:#fff;font-family:Arial,sans-serif}
        .hero{height:85vh;position:relative;overflow:hidden}
        .slide{position:absolute;top:0;left:0;width:100%;height:100%;background-size:cover;background-position:center;opacity:0;transition:opacity .8s}
        .slide.active{opacity:1}
        .hero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:1}
        .hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
        .hero h1{font-size:4em}
        .hero p{margin-top:15px;font-size:1.2em}
        .categories{padding:30px 60px 0;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
        .category-btn{background:#2a2a2a;border:none;color:#fff;padding:10px 24px;border-radius:30px;cursor:pointer;transition:transform .2s}
        .category-btn:hover{background:#444;transform:translateY(-2px)}
        .category-btn.active{background:#fff;color:#000}
        .gallery{display:grid;gap:20px;padding:40px 60px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
        .gallery-item{overflow:hidden;border-radius:8px;cursor:pointer}
        .gallery img{width:100%;height:300px;object-fit:cover;display:block;transition:transform .3s}
        .gallery-item:hover img{transform:scale(1.03)}
        #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:1000;cursor:pointer}
        #lightbox img{max-width:85%;max-height:85%;border-radius:10px}
        .lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.2);color:#fff;border:none;font-size:40px;padding:20px 15px;cursor:pointer;z-index:1001}
        .lightbox-nav:hover{background:rgba(255,255,255,.4)}
        .lightbox-prev{left:20px}
        .lightbox-next{right:20px}
        .lightbox-close{position:absolute;top:20px;right:30px;background:0 0;border:none;color:#fff;font-size:40px;cursor:pointer;z-index:1001}
        #toTop{position:fixed;bottom:20px;right:20px;background:#fff;color:#000;border:none;padding:12px 18px;border-radius:50px;cursor:pointer;display:none;z-index:99}
        /* Офлайн-индикатор */
        .offline-badge{position:fixed;bottom:20px;left:20px;background:#ff4444;color:#fff;padding:8px 15px;border-radius:50px;font-size:12px;z-index:99;display:none}
        @media (max-width:768px){
            .hero{height:60vh}
            .hero h1{font-size:2em}
            .hero p{font-size:1em}
            .gallery{grid-template-columns:repeat(2,1fr);padding:20px 12px;gap:8px}
            .gallery img{height:170px}
            .categories{padding:20px 12px 0}
            .category-btn{padding:6px 16px;font-size:12px}
            .lightbox-nav{font-size:25px;padding:10px}
            .offline-badge{bottom:80px}
        }
        footer{text-align:center;padding:40px 20px;font-size:14px;opacity:.6}
    </style>
</head>
<body>

<section class="hero">
    <div class="slide active" style="background-image:url('images/1.jpg')"></div>
    <div class="slide" style="background-image:url('images/2.jpg')"></div>
    <div class="slide" style="background-image:url('images/3.jpg')"></div>
    <div class="slide" style="background-image:url('images/4.jpg')"></div>
    <div class="slide" style="background-image:url('images/5.jpg')"></div>
    <div class="hero-content">
        <h1>Amigo Photos</h1>
        <p>Архитектура · Природа · Детали</p>
        <p>Фотография — способ сохранить моменты</p>
    </div>
</section>

<div class="categories" id="categories"></div>
<section class="gallery" id="gallery"></section>

<div id="lightbox">
    <button class="lightbox-close">✕</button>
    <button class="lightbox-nav lightbox-prev">❮</button>
    <button class="lightbox-nav lightbox-next">❯</button>
    <img src="">
</div>

<button id="toTop">↑ Наверх</button>
<div class="offline-badge" id="offlineBadge">📡 Офлайн-режим</div>
<footer>© 2026 Amigo Photos — All Rights Reserved</footer>

<script>
// ═══════════════════════════════════════════════════════════════
//  📸 НАСТРОЙКИ (меняй здесь под себя)
// ═══════════════════════════════════════════════════════════════

const CATEGORIES = {
    all:       { name: '📷 Все' },
    architecture: { name: '🏛️ Архитектура' },
    nature:    { name: '🌿 Природа' },
    details:   { name: '🔍 Детали' }
};

// ФОТОГРАФИИ (просто добавляй новые строчки)
const PHOTOS = [
    // Архитектура (10 фото)
    { id:1, cat:'architecture' }, { id:3, cat:'architecture' }, { id:4, cat:'architecture' },
    { id:6, cat:'architecture' }, { id:9, cat:'architecture' }, { id:10,cat:'architecture' },
    { id:13,cat:'architecture' }, { id:14,cat:'architecture' }, { id:15,cat:'architecture' }, { id:18,cat:'architecture' },
    // Природа (9 фото)
    { id:2, cat:'nature' }, { id:7, cat:'nature' }, { id:8, cat:'nature' }, { id:11,cat:'nature' },
    { id:16,cat:'nature' }, { id:17,cat:'nature' }, { id:19,cat:'nature' }, { id:20,cat:'nature' }, { id:21,cat:'nature' },
    // Детали (4 фото)
    { id:5, cat:'details' }, { id:12,cat:'details' }, { id:22,cat:'details' }, { id:23,cat:'details' }
];

// ═══════════════════════════════════════════════════════════════
//  ⚡ ДВИЖОК (ничего не трогать)
// ═══════════════════════════════════════════════════════════════

const gallery = document.getElementById('gallery');
const categoriesDiv = document.getElementById('categories');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
let currentIndex = 0;

// Генерация кнопок
Object.keys(CATEGORIES).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'category-btn' + (key === 'all' ? ' active' : '');
    btn.textContent = CATEGORIES[key].name;
    btn.onclick = () => {
        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(key === 'all' ? PHOTOS : PHOTOS.filter(p => p.cat === key));
    };
    categoriesDiv.appendChild(btn);
});

// Отрисовка галереи
function render(photos) {
    gallery.innerHTML = '';
    photos.forEach(photo => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        const img = document.createElement('img');
        img.src = `images/${photo.id}.jpg`;
        img.alt = `Фото ${photo.id}`;
        img.onclick = () => openLightbox(PHOTOS.findIndex(p => p.id === photo.id));
        div.appendChild(img);
        gallery.appendChild(div);
    });
}

// Лайтбокс
function openLightbox(idx) { currentIndex = idx; lightboxImg.src = `images/${PHOTOS[idx].id}.jpg`; lightbox.style.display = 'flex'; }
function closeLightbox() { lightbox.style.display = 'none'; }
function prev() { currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length; lightboxImg.src = `images/${PHOTOS[currentIndex].id}.jpg`; }
function next() { currentIndex = (currentIndex + 1) % PHOTOS.length; lightboxImg.src = `images/${PHOTOS[currentIndex].id}.jpg`; }

// Слайдер
let s=0, slides=document.querySelectorAll('.slide');
setInterval(() => { slides[s].classList.remove('active'); s=(s+1)%slides.length; slides[s].classList.add('active'); }, 5000);

// Кнопка наверх
const toTop = document.getElementById('toTop');
window.onscroll = () => toTop.style.display = window.scrollY > 300 ? 'block' : 'none';
toTop.onclick = () => window.scrollTo({top:0,behavior:'smooth'});

// События
document.querySelector('.lightbox-close').onclick = closeLightbox;
document.querySelector('.lightbox-prev').onclick = prev;
document.querySelector('.lightbox-next').onclick = next;
lightbox.onclick = e => { if(e.target === lightbox) closeLightbox(); };
document.onkeydown = e => { if(lightbox.style.display === 'flex') { if(e.key === 'Escape') closeLightbox(); if(e.key === 'ArrowLeft') prev(); if(e.key === 'ArrowRight') next(); } };

// ═══════════════════════════════════════════════════════════════
//  📡 SERVICE WORKER (ОФЛАЙН-РЕЖИМ)
// ═══════════════════════════════════════════════════════════════

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
        console.log('Service Worker зарегистрирован:', reg);
    }).catch(err => {
        console.log('Ошибка регистрации Service Worker:', err);
    });
}

// Показываем индикатор при офлайн-режиме
window.addEventListener('load', () => {
    const badge = document.getElementById('offlineBadge');
    if (!navigator.onLine) {
        badge.style.display = 'block';
        setTimeout(() => badge.style.display = 'none', 3000);
    }
    window.addEventListener('online', () => badge.style.display = 'none');
    window.addEventListener('offline', () => {
        badge.style.display = 'block';
        setTimeout(() => badge.style.display = 'none', 3000);
    });
});

// Старт
render(PHOTOS);
</script>

<script>
// Дополнительный скрипт для создания sw.js (если файла нет)
// Этот скрипт создаст service worker автоматически
if ('serviceWorker' in navigator) {
    // Проверяем, существует ли sw.js, если нет — создаём через Blob
    fetch('/sw.js').catch(() => {
        const swCode = `const CACHE_NAME = 'amigo-photos-v1';
const urlsToCache = [
    '/',
    '/index.html'
];

self.addEventListener('install', event => {
    event.waitUntil(
        caches.open(CACHE_NAME)
            .then(cache => cache.addAll(urlsToCache))
    );
});

self.addEventListener('fetch', event => {
    event.respondWith(
        caches.match(event.request)
            .then(response => response || fetch(event.request))
    );
});`;
        
        const blob = new Blob([swCode], {type: 'application/javascript'});
        const url = URL.createObjectURL(blob);
        navigator.serviceWorker.register(url).then(reg => {
            console.log('Service Worker создан автоматически');
        });
    });
}
</script>
</body>
</html>
