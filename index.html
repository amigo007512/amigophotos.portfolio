<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2D4VS5FRD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y2D4VS5FRD');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>АМИГО — фотоистории</title>
    
    <meta name="description" content="Визуальные нарративы. Архитектура, природа, детали.">
    <meta property="og:title" content="АМИГО — фотоистории">
    <meta property="og:description" content="Каждый кадр — история">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23fff'/%3E%3C/svg%3E">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3f0;
            color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            z-index: 40;
            background: rgba(245, 243, 240, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Главный контейнер — всё на одном экране */
        .main-content {
            min-height: 100vh;
            padding: 100px 40px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Верхняя часть — заголовок и кнопки */
        .top-section {
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }

        /* Кнопки категорий */
        .categories-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .category-btn {
            padding: 14px 30px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: transparent;
            border: 1.5px solid #1a1a1a;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #1a1a1a;
            white-space: nowrap;
            position: relative;
        }

        .category-btn:hover {
            background: #1a1a1a;
            color: #fff;
        }

        .category-btn.active {
            background: #1a1a1a;
            color: #fff;
        }

        /* Анимация улетания */
        .flying-btn {
            position: fixed;
            z-index: 1000;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            white-space: nowrap;
        }

        /* Нижняя часть — описание и галерея */
        .bottom-section {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 50px;
            transition: opacity 0.3s ease;
        }

        .category-info {
            transition: all 0.4s ease;
        }

        .category-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .category-description {
            font-size: 15px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

        .photo-count {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        /* Галерея */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            transition: all 0.5s ease;
        }

        @media (min-width: 1200px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
            background: #e0ddd9;
            opacity: 0;
            animation: fadeInItem 0.4s ease forwards;
            animation-delay: calc(var(--index) * 0.04s);
        }

        @keyframes fadeInItem {
            to { opacity: 1; }
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .item-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .item-number {
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* Анимация появления нового контента */
        .content-changing {
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .slide-from-left {
            animation: slideLeft 0.5s ease forwards;
        }

        .slide-from-right {
            animation: slideRight 0.5s ease forwards;
        }

        @keyframes slideLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Лайтбокс */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(245, 243, 240, 0.98);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 32px;
            right: 40px;
            background: none;
            border: none;
            color: #1a1a1a;
            font-size: 36px;
            cursor: pointer;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            opacity: 0.5;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #1a1a1a;
            font-size: 48px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 300;
        }

        .lightbox-nav:hover {
            opacity: 0.5;
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }

        /* Адаптив */
        @media (max-width: 900px) {
            .bottom-section {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .main-content {
                padding: 90px 20px 40px;
            }
            .header {
                padding: 16px 20px;
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            .category-btn {
                padding: 12px 20px;
                font-size: 14px;
            }
            h1 {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<header class="header">
    <div class="logo">АМИГО</div>
</header>

<div class="main-content">
    <div class="top-section">
        <h1>Истории<br>в каждом кадре</h1>
        
        <div class="categories-row" id="categoriesRow">
            <button class="category-btn active" data-category="all">ВСЁ</button>
            <button class="category-btn" data-category="architecture">АРХИТЕКТУРА</button>
            <button class="category-btn" data-category="nature">ПРИРОДА</button>
            <button class="category-btn" data-category="details">ДЕТАЛИ</button>
        </div>
    </div>
    
    <div class="bottom-section" id="bottomSection">
        <div class="category-info" id="categoryInfo">
            <div class="category-icon" id="categoryIcon">📷</div>
            <div class="category-title" id="categoryTitle">Все работы</div>
            <div class="category-description" id="categoryDesc">
                Полная коллекция визуальных историй. Архитектурные формы, природные текстуры и внимание к деталям — каждая фотография особенная.
            </div>
            <div class="photo-count" id="photoCount"></div>
        </div>
        
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
</div>

<!-- Лайтбокс -->
<div id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">←</button>
    <button class="lightbox-nav lightbox-next" id="lightboxNext">→</button>
    <img id="lightboxImg" src="" alt="">
</div>

<script>
    // Данные
    const CATEGORIES_DATA = {
        all: {
            icon: '📷',
            title: 'Все работы',
            desc: 'Полная коллекция визуальных историй. Архитектурные формы, природные текстуры и внимание к деталям — каждая фотография особенная.',
            photos: [
                { id:1 }, { id:2 }, { id:3 }, { id:4 }, { id:5 },
                { id:6 }, { id:7 }, { id:8 }, { id:9 }, { id:10 },
                { id:12 }, { id:13 }, { id:14 }, { id:15 }, { id:16 },
                { id:17 }, { id:18 }, { id:19 }, { id:20 }, { id:21 },
                { id:22 }, { id:23 }, { id:24 }, { id:25 }, { id:26 },
                { id:28 }, { id:30 }, { id:32 }
            ]
        },
        architecture: {
            icon: '🏛️',
            title: 'Архитектура',
            desc: 'Линии, формы и пространство. Городская геометрия и монументальные сооружения в объективе. Игра света на фасадах, строгость конструкций и ритм урбанистического пейзажа.',
            photos: [
                { id:1 }, { id:3 }, { id:4 }, { id:6 }, { id:9 }, 
                { id:10 }, { id:13 }, { id:14 }, { id:15 }, { id:18 }
            ]
        },
        nature: {
            icon: '🌿',
            title: 'Природа',
            desc: 'Органические формы и естественная красота. Леса, горы, водные глади — моменты тишины и величия природного мира. Каждый кадр наполнен светом и жизнью.',
            photos: [
                { id:2 }, { id:7 }, { id:8 }, { id:16 }, { id:17 }, 
                { id:19 }, { id:20 }, { id:21 }, { id:25 }, { id:26 }, 
                { id:28 }, { id:30 }, { id:32 }
            ]
        },
        details: {
            icon: '🔍',
            title: 'Детали',
            desc: 'Красота в мелочах. Текстуры, фактуры и незаметные на первый взгляд элементы, которые создают целостную картину. Внимание к тому, что обычно ускользает от взгляда.',
            photos: [
                { id:5 }, { id:12 }, { id:22 }, { id:23 }, { id:24 }
            ]
        }
    };

    let currentCategory = 'all';
    let currentPhotos = CATEGORIES_DATA.all.photos;
    
    const categoryInfo = document.getElementById('categoryInfo');
    const categoryIcon = document.getElementById('categoryIcon');
    const categoryTitle = document.getElementById('categoryTitle');
    const categoryDesc = document.getElementById('categoryDesc');
    const photoCount = document.getElementById('photoCount');
    const galleryGrid = document.getElementById('galleryGrid');

    // Рендер галереи
    function renderGallery(photos) {
        galleryGrid.innerHTML = '';
        photos.forEach((photo, idx) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.style.setProperty('--index', idx);
            
            const img = document.createElement('img');
            img.src = `images/${photo.id}.jpg`;
            img.alt = `Фото ${photo.id}`;
            img.loading = 'lazy';
            
            const overlay = document.createElement('div');
            overlay.className = 'item-overlay';
            overlay.innerHTML = `<span class="item-number">#${photo.id}</span>`;
            
            item.appendChild(img);
            item.appendChild(overlay);
            
            item.addEventListener('click', () => openLightbox(idx));
            
            galleryGrid.appendChild(item);
        });
        photoCount.textContent = `${photos.length} фотографий`;
        currentPhotos = photos;
    }

    // Обновление информации о категории
    function updateCategoryInfo(category) {
        const data = CATEGORIES_DATA[category];
        categoryIcon.textContent = data.icon;
        categoryTitle.textContent = data.title;
        categoryDesc.textContent = data.desc;
    }

    // Анимация смены контента
    function switchCategory(category, clickedBtn) {
        if (category === currentCategory) return;
        
        const rect = clickedBtn.getBoundingClientRect();
        
        // Клон кнопки улетает влево
        const flyingBtn = clickedBtn.cloneNode(true);
        flyingBtn.classList.add('flying-btn');
        flyingBtn.style.left = rect.left + 'px';
        flyingBtn.style.top = rect.top + 'px';
        flyingBtn.style.width = rect.width + 'px';
        document.body.appendChild(flyingBtn);
        
        requestAnimationFrame(() => {
            flyingBtn.style.transform = `translateX(-${rect.left + rect.width + 50}px) rotate(-10deg)`;
            flyingBtn.style.opacity = '0';
        });
        
        setTimeout(() => flyingBtn.remove(), 500);
        
        // Анимация смены контента
        categoryInfo.style.animation = 'none';
        galleryGrid.style.animation = 'none';
        
        setTimeout(() => {
            categoryInfo.style.animation = 'slideLeft 0.4s ease forwards';
            galleryGrid.style.animation = 'slideRight 0.4s ease forwards';
            
            updateCategoryInfo(category);
            renderGallery(CATEGORIES_DATA[category].photos);
            
            // Обновляем активную кнопку
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category === category) {
                    btn.classList.add('active');
                }
            });
            
            currentCategory = category;
        }, 50);
    }

    // Лайтбокс
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    let lightboxIndex = 0;

    function openLightbox(index) {
        lightboxIndex = index;
        updateLightboxImage();
        lightbox.style.display = 'flex';
    }

    function updateLightboxImage() {
        lightboxImg.src = `images/${currentPhotos[lightboxIndex].id}.jpg`;
    }

    // Обработчики кнопок
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const category = this.dataset.category;
            switchCategory(category, this);
        });
    });

    // Лайтбокс управление
    document.getElementById('lightboxClose').addEventListener('click', () => {
        lightbox.style.display = 'none';
    });

    document.getElementById('lightboxPrev').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!currentPhotos.length) return;
        lightboxIndex = (lightboxIndex - 1 + currentPhotos.length) % currentPhotos.length;
        updateLightboxImage();
    });

    document.getElementById('lightboxNext').addEventListener('click', (e) => {
        e.stopPropagation();
        if (!currentPhotos.length) return;
        lightboxIndex = (lightboxIndex + 1) % currentPhotos.length;
        updateLightboxImage();
    });

    lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) lightbox.style.display = 'none';
    });

    document.addEventListener('keydown', (e) => {
        if (lightbox.style.display !== 'flex') return;
        if (e.key === 'Escape') lightbox.style.display = 'none';
        if (e.key === 'ArrowLeft') {
            lightboxIndex = (lightboxIndex - 1 + currentPhotos.length) % currentPhotos.length;
            updateLightboxImage();
        }
        if (e.key === 'ArrowRight') {
            lightboxIndex = (lightboxIndex + 1) % currentPhotos.length;
            updateLightboxImage();
        }
    });

    // Инициализация
    renderGallery(CATEGORIES_DATA.all.photos);
</script>
</body>
</html>
