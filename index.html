<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMIGO █░▒▓  —  floating fragments</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #030303;
            color: #eaeaea;
            font-family: 'Inter', 'SF Mono', monospace;
            overflow-x: hidden;
        }

        /* жирный приветственный экран */
        .intro {
            position: fixed;
            inset: 0;
            background: #030303;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .intro h1 {
            font-size: clamp(32px, 10vw, 120px);
            font-weight: 300;
            letter-spacing: -0.02em;
            background: linear-gradient(125deg, #fff, #666, #fff);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: breathe 3s ease infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; letter-spacing: -0.02em; }
            50% { opacity: 1; letter-spacing: 4px; }
        }

        .intro p {
            margin-top: 24px;
            font-size: 12px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #444;
        }

        /* основной контент — сначала скрыт */
        .main {
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* плавающий хедер */
        .floating-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: transparent;
            pointer-events: none;
        }

        .logo {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            background: rgba(3,3,3,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            pointer-events: auto;
        }

        .counter {
            font-size: 12px;
            font-family: monospace;
            background: rgba(3,3,3,0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            pointer-events: auto;
        }

        /* кнопки-трансформеры */
        .shape-nav {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 12px;
            background: rgba(3,3,3,0.7);
            backdrop-filter: blur(20px);
            padding: 8px 20px;
            border-radius: 60px;
            border: 0.5px solid rgba(255,255,255,0.08);
        }

        .shape-btn {
            background: transparent;
            border: none;
            color: #888;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .shape-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        .shape-btn.active {
            background: #fff;
            color: #030303;
        }

        /* ГЛАВНАЯ СЕТКА — ДЫШАЩАЯ, ХАОТИЧНАЯ */
        .grid {
            min-height: 100vh;
            padding: 120px 40px 140px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            transition: all 0.4s ease;
        }

        .cell {
            position: relative;
            background: #0a0a0a;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.4, 1.2);
            aspect-ratio: 1 / 1;
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease, filter 0.4s;
            filter: grayscale(0.3) contrast(1.05);
        }

        .cell:hover img {
            transform: scale(1.08);
            filter: grayscale(0) contrast(1.1);
        }

        /* случайные размеры — НИКАКОЙ СЕТКИ НЕТ */
        .cell:nth-child(3n+1) {
            grid-column: span 2;
            grid-row: span 2;
        }
        .cell:nth-child(5n+2) {
            grid-column: span 1;
            grid-row: span 1;
        }
        .cell:nth-child(7n+4) {
            grid-column: span 2;
            grid-row: span 1;
            aspect-ratio: 2 / 1;
        }
        .cell:nth-child(11n+7) {
            grid-column: span 1;
            grid-row: span 2;
            aspect-ratio: 1 / 2;
        }

        /* лайтбокс — портал */
        .portal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            backdrop-filter: blur(40px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .portal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 4px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
        }

        .portal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.1);
            width: 56px;
            height: 56px;
            border-radius: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

        .portal-nav:hover {
            background: rgba(255,255,255,0.1);
        }

        .portal-prev { left: 28px; }
        .portal-next { right: 28px; }

        .portal-close {
            position: absolute;
            top: 28px;
            right: 32px;
            background: rgba(255,255,255,0.03);
            border: 0.5px solid rgba(255,255,255,0.1);
            width: 48px;
            height: 48px;
            border-radius: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .portal-counter {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            font-family: monospace;
        }

        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 100px 16px 120px;
            }
            .cell:nth-child(3n+1),
            .cell:nth-child(7n+4),
            .cell:nth-child(11n+7) {
                grid-column: span 1;
                grid-row: span 1;
                aspect-ratio: 1 / 1;
            }
            .shape-nav {
                bottom: 20px;
                padding: 6px 16px;
            }
            .shape-btn {
                padding: 4px 14px;
                font-size: 10px;
            }
        }

        /* футер — минимальный */
        .footer {
            position: fixed;
            bottom: 16px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: #222;
            z-index: 99;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="intro" id="intro">
    <h1>AMIGO</h1>
    <p>enter ▸</p>
</div>

<div class="main" id="main">
    <div class="floating-header">
        <div class="logo">FRAGMENTS</div>
        <div class="counter" id="globalCounter">0 frames</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="shape-nav">
        <button class="shape-btn active" data-filter="all">all</button>
        <button class="shape-btn" data-filter="architecture">arch</button>
        <button class="shape-btn" data-filter="nature">nature</button>
        <button class="shape-btn" data-filter="details">detail</button>
    </div>
    <div class="footer">✦ random grid ✦</div>
</div>

<div class="portal" id="portal">
    <div class="portal-close" id="portalClose">✕</div>
    <div class="portal-nav portal-prev" id="portalPrev">←</div>
    <div class="portal-nav portal-next" id="portalNext">→</div>
    <img id="portalImg" src="">
    <div class="portal-counter" id="portalCounter"></div>
</div>

<script>
    // ==========================================
    // ДАННЫЕ — 32 кадра
    // ==========================================
    const PHOTOS = [
        { id: 1, cat: 'architecture' }, { id: 3, cat: 'architecture' }, { id: 4, cat: 'architecture' },
        { id: 6, cat: 'architecture' }, { id: 9, cat: 'architecture' }, { id: 10, cat: 'architecture' },
        { id: 13, cat: 'architecture' }, { id: 14, cat: 'architecture' }, { id: 15, cat: 'architecture' }, { id: 18, cat: 'architecture' },
        { id: 2, cat: 'nature' }, { id: 7, cat: 'nature' }, { id: 8, cat: 'nature' }, { id: 11, cat: 'nature' },
        { id: 16, cat: 'nature' }, { id: 17, cat: 'nature' }, { id: 19, cat: 'nature' }, { id: 20, cat: 'nature' }, { id: 21, cat: 'nature' },
        { id: 25, cat: 'nature' }, { id: 26, cat: 'nature' }, { id: 27, cat: 'nature' }, { id: 28, cat: 'nature' },
        { id: 29, cat: 'nature' }, { id: 30, cat: 'nature' }, { id: 31, cat: 'nature' }, { id: 32, cat: 'nature' },
        { id: 5, cat: 'details' }, { id: 12, cat: 'details' }, { id: 22, cat: 'details' }, { id: 23, cat: 'details' }, { id: 24, cat: 'details' }
    ];

    let currentFilter = 'all';
    let currentDisplay = [...PHOTOS];
    let currentIndex = 0;

    const gridEl = document.getElementById('grid');
    const portal = document.getElementById('portal');
    const portalImg = document.getElementById('portalImg');
    const portalCounter = document.getElementById('portalCounter');
    const globalCounter = document.getElementById('globalCounter');

    // обновляем счётчик
    function updateCounter() {
        globalCounter.innerText = `${currentDisplay.length} frames`;
    }

    // ГЛАВНАЯ ФУНКЦИЯ — РЕНДЕР С ХАОТИЧНОЙ СЕТКОЙ
    function renderGrid(photos) {
        gridEl.style.opacity = '0';
        setTimeout(() => {
            gridEl.innerHTML = '';
            photos.forEach((photo, idx) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const img = document.createElement('img');
                img.loading = idx < 12 ? 'eager' : 'lazy';
                img.decoding = 'async';
                img.src = `images/${photo.id}.jpg`;
                img.alt = `amigo_${photo.id}`;
                img.onclick = () => openPortal(PHOTOS.findIndex(p => p.id === photo.id));
                
                cell.appendChild(img);
                gridEl.appendChild(cell);
            });
            gridEl.style.opacity = '1';
            updateCounter();
        }, 200);
    }

    function filterGallery(category) {
        if (category === 'all') {
            currentDisplay = [...PHOTOS];
        } else {
            currentDisplay = PHOTOS.filter(p => p.cat === category);
        }
        renderGrid(currentDisplay);
    }

    // ПОРТАЛ (ЛАЙТБОКС)
    function openPortal(index) {
        currentIndex = index;
        const photo = PHOTOS[currentIndex];
        portalImg.src = `images/${photo.id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
        portal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closePortal() {
        portal.style.display = 'none';
        document.body.style.overflow = '';
    }

    function nextPortal() {
        currentIndex = (currentIndex + 1) % PHOTOS.length;
        portalImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    function prevPortal() {
        currentIndex = (currentIndex - 1 + PHOTOS.length) % PHOTOS.length;
        portalImg.src = `images/${PHOTOS[currentIndex].id}.jpg`;
        portalCounter.innerText = `${currentIndex + 1} / ${PHOTOS.length}`;
    }

    // ==========================================
    // ИНТРО + ЗАПУСК
    // ==========================================
    const intro = document.getElementById('intro');
    const main = document.getElementById('main');

    intro.addEventListener('click', () => {
        intro.style.opacity = '0';
        setTimeout(() => {
            intro.style.display = 'none';
            main.style.opacity = '1';
            // предзагружаем первые 10 фото
            for (let i = 0; i < 10; i++) {
                const pre = new Image();
                pre.src = `images/${PHOTOS[i].id}.jpg`;
            }
        }, 800);
    });

    // ==========================================
    // СОБЫТИЯ
    // ==========================================
    document.querySelectorAll('.shape-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            filterGallery(currentFilter);
        };
    });

    document.getElementById('portalClose').onclick = closePortal;
    document.getElementById('portalPrev').onclick = prevPortal;
    document.getElementById('portalNext').onclick = nextPortal;
    portal.onclick = (e) => { if (e.target === portal) closePortal(); };
    document.addEventListener('keydown', (e) => {
        if (portal.style.display === 'flex') {
            if (e.key === 'Escape') closePortal();
            if (e.key === 'ArrowLeft') prevPortal();
            if (e.key === 'ArrowRight') nextPortal();
        }
    });

    // старт (интро активно, сетка пока скрыта, но рендерим фоном)
    renderGrid(PHOTOS);
</script>
</body>
</html>
