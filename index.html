<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2D4VS5FRD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y2D4VS5FRD');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Photos — фотопортфолио</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0e0e0e;
            color: #fff;
        }

        .hero {
            height: 85vh;
            background: url('images/1.jpg') center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        .hero h1 {
            font-size: 4em;
            margin: 0;
        }

        .hero p {
            margin-top: 15px;
            font-size: 1.2em;
        }

        .gallery {
            display: grid;
            gap: 20px;
            padding: 60px;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        #lightbox img {
            max-width: 95%;
            max-height: 90%;
            border-radius: 10px;
        }

        #toTop {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            transition: opacity 0.2s;
        }

        @media (max-width: 768px) {
            .hero {
                height: 60vh;
            }
            .hero h1 {
                font-size: 2em;
            }
            .hero p {
                font-size: 1em;
            }
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                padding: 12px;
                gap: 8px;
            }
            .gallery img {
                height: 170px;
            }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="hero-content">
        <h1>Amigo Photos</h1>
        <p>Стрит-фотография и пейзажи</p>
        <p>Фотография — способ сохранить моменты</p>
    </div>
</section>

<section class="gallery">
    <img src="images/1.jpg" loading="lazy" alt="Фото 1">
    <img src="images/2.jpg" loading="lazy" alt="Фото 2">
    <img src="images/3.jpg" loading="lazy" alt="Фото 3">
    <img src="images/4.jpg" loading="lazy" alt="Фото 4">
    <img src="images/5.jpg" loading="lazy" alt="Фото 5">
    <img src="images/6.jpg" loading="lazy" alt="Фото 6">
    <img src="images/7.jpg" loading="lazy" alt="Фото 7">
    <img src="images/8.jpg" loading="lazy" alt="Фото 8">
    <img src="images/9.jpg" loading="lazy" alt="Фото 9">
    <img src="images/10.jpg" loading="lazy" alt="Фото 10">
    <img src="images/11.jpg" loading="lazy" alt="Фото 11">
    <img src="images/12.jpg" loading="lazy" alt="Фото 12">
    <img src="images/13.jpg" loading="lazy" alt="Фото 13">
    <img src="images/14.jpg" loading="lazy" alt="Фото 14">
    <img src="images/15.jpg" loading="lazy" alt="Фото 15">
    <img src="images/16.jpg" loading="lazy" alt="Фото 16">
    <img src="images/17.jpg" loading="lazy" alt="Фото 17">
    <img src="images/18.jpg" loading="lazy" alt="Фото 18">
    <img src="images/19.jpg" loading="lazy" alt="Фото 19">
    <img src="images/20.jpg" loading="lazy" alt="Фото 20">
    <img src="images/21.jpg" loading="lazy" alt="Фото 21">
    <img src="images/22.jpg" loading="lazy" alt="Фото 22">
    <img src="images/23.jpg" loading="lazy" alt="Фото 23">
</section>

<div id="lightbox">
    <img src="">
</div>

<button id="toTop">↑</button>

<footer>
    © 2026 Amigo Photos — All Rights Reserved
</footer>

<script>
// Галерея и лайтбокс
const galleryImages = document.querySelectorAll('.gallery img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

galleryImages.forEach(img => {
    img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.style.display = 'flex';
    });
});

lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
});

// Закрытие по Escape
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.style.display === 'flex') {
        lightbox.style.display = 'none';
    }
});

// Кнопка наверх
const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => {
    toTop.style.display = window.scrollY > 300 ? 'block' : 'none';
});
toTop.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
});
</script>

</body>
</html>
