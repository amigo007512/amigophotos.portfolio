<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMIGO — журнал света</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #fef9f0;
            font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif;
            overflow-x: hidden;
            color: #2c2c2c;
        }

        /* основной контейнер с "журналом" */
        .magazine {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px 100px;
            position: relative;
        }

        /* герой — как обложка */
        .cover {
            text-align: center;
            padding: 80px 20px 60px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            margin-bottom: 60px;
        }

        .cover h1 {
            font-size: clamp(48px, 8vw, 110px);
            font-weight: 400;
            letter-spacing: -0.02em;
            color: #1a1a1a;
            font-family: 'Playfair Display', serif;
        }

        .cover p {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            margin-top: 20px;
        }

        /* навигация — как оглавление */
        .nav-toc {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 80px;
            flex-wrap: wrap;
        }

        .toc-item {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 6px 0;
            color: #aaa;
            transition: all 0.2s;
            border-bottom: 1px solid transparent;
        }

        .toc-item:hover {
            color: #2c2c2c;
        }

        .toc-item.active {
            color: #2c2c2c;
            border-bottom-color: #2c2c2c;
        }

        /* контейнер для "разворотов" */
        .spreads {
            position: relative;
            min-height: 70vh;
        }

        /* каждый разворот — отдельная секция */
        .spread {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            animation: fadeUp 0.8s ease;
        }

        .spread.active-spread {
            display: grid;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* левая страница — фото */
        .photo-page {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 20px 35px -15px rgba(0,0,0,0.2);
        }

        .photo-page img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s ease;
        }

        .photo-page:hover img {
            transform: scale(1.02);
        }

        /* правая страница — текст */
        .text-page {
            padding: 20px;
        }

        .text-page h2 {
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 24px;
            font-family: 'Playfair Display', serif;
        }

        .text-page .meta {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #b0a07c;
            margin-bottom: 20px;
        }

        .text-page .description {
            font-size: 16px;
            line-height: 1.6;
            color: #4a4a4a;
            margin-bottom: 30px;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .text-page .quote {
            font-style: italic;
            border-left: 2px solid #d4c5a9;
            padding-left: 20px;
            font-size: 14px;
            color: #6a6a6a;
        }

        /* навигация по страницам (стрелки) */
        .nav-arrows {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 60px;
        }

        .arrow {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: monospace;
            color: #2c2c2c;
        }

        .arrow:hover {
            background: #2c2c2c;
            color: #fef9f0;
            border-color: #2c2c2c;
        }

        /* индикатор страницы */
        .page-indicator {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #bbb;
            letter-spacing: 2px;
        }

        /* мобильная версия */
        @media (max-width: 800px) {
            .magazine {
                padding: 30px 20px 80px;
            }
            .spread.active-spread {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .photo-page {
                order: 1;
            }
            .text-page {
                order: 2;
                padding: 0;
            }
            .nav-toc {
                gap: 20px;
                margin-bottom: 50px;
            }
            .toc-item {
                font-size: 10px;
            }
        }

        /* интро */
        .intro {
            position: fixed;
            inset: 0;
            background: #fef9f0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 1s ease;
        }

        .intro h2 {
            font-size: clamp(32px, 8vw, 70px);
            font-weight: 300;
            letter-spacing: 6px;
            color: #2c2c2c;
        }

        .intro p {
            margin-top: 24px;
            font-size: 12px;
            letter-spacing: 4px;
            color: #b0a07c;
        }

        /* счётчик фото в углу */
        .badge {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0,0,0,0.05);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-family: monospace;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="intro" id="intro">
    <h2>AMIGO</h2>
    <p>журнал света</p>
</div>

<div class="magazine" id="magazine" style="opacity:0; transition: opacity 1s;">
    <div class="cover">
        <h1>AMIGO</h1>
        <p>визуальные истории</p>
    </div>

    <div class="nav-toc" id="toc">
        <div class="toc-item active" data-cat="all">все истории</div>
        <div class="toc-item" data-cat="architecture">архитектура</div>
        <div class="toc-item" data-cat="nature">природа</div>
        <div class="toc-item" data-cat="details">детали</div>
    </div>

    <div class="spreads" id="spreadsContainer"></div>

    <div class="nav-arrows">
        <button class="arrow" id="prevSpread">← предыдущая</button>
        <button class="arrow" id="nextSpread">следующая →</button>
    </div>
    <div class="page-indicator" id="pageIndicator">страница 1 / 1</div>
</div>

<div class="badge" id="photoCountBadge">0 кадров</div>

<script>
    // ==========================================
    // ДАННЫЕ: фотографии + живые описания
    // ==========================================
    const PHOTOS = [
        { id: 1, cat: 'architecture', title: 'Каменная симфония', desc: 'Линии, уходящие в небо. Архитектура как застывшая музыка, которая звучит в каждом углу города.', quote: '«Геометрия — это язык света»' },
        { id: 3, cat: 'architecture', title: 'Вертикальный ритм', desc: 'Колонны, арки, повторяющиеся элементы — город дышит своим пульсом.', quote: '«Порядок рождает красоту»' },
        { id: 4, cat: 'architecture', title: 'Стекло и бетон', desc: 'Современные монолиты, отражающие небо. Город будущего уже здесь.', quote: '«Минимализм — высшая степень элегантности»' },
        { id: 6, cat: 'architecture', title: 'Старый город', desc: 'Фасады, помнящие столетия. Каждая трещина — история.', quote: '«Время — лучший архитектор»' },
        { id: 9, cat: 'architecture', title: 'Мост через время', desc: 'Конструкции, соединяющие берега и эпохи.', quote: '«Инженерия становится поэзией»' },
        { id: 10, cat: 'architecture', title: 'Светотени', desc: 'Игра теней на древних стенах. Архитектура оживает при закате.', quote: '«Тень — это тоже свет»' },
        { id: 13, cat: 'architecture', title: 'Башни-близнецы', desc: 'Стремление ввысь, человеческий дух.', quote: '«Гравитация — это вызов»' },
        { id: 14, cat: 'architecture', title: 'Внутренний двор', desc: 'Тишина, спрятанная от шумных улиц.', quote: '«Секретные места города»' },
        { id: 15, cat: 'architecture', title: 'Аркада', desc: 'Повторяющиеся своды, уводящие в бесконечность.', quote: '«Ритм — основа гармонии»' },
        { id: 18, cat: 'architecture', title: 'Зеркало неба', desc: 'Фасад, отражающий облака. Город становится частью природы.', quote: '«Отражение — это диалог»' },
        
        { id: 2, cat: 'nature', title: 'Лесной покров', desc: 'Сквозь ветви пробивается золотой свет. Природа говорит на языке тишины.', quote: '«Тишина — самый громкий звук»' },
        { id: 7, cat: 'nature', title: 'Водная гладь', desc: 'Озеро, замершее в ожидании рассвета.', quote: '«Вода помнит всё»' },
        { id: 8, cat: 'nature', title: 'Горный хребет', desc: 'Вершины, уходящие в облака. Свобода, от которой захватывает дух.', quote: '«Высота меняет перспективу»' },
        { id: 11, cat: 'nature', title: 'Полевые цветы', desc: 'Весенний ковёр из диких трав.', quote: '«Красота в простоте»' },
        { id: 16, cat: 'nature', title: 'Закат над морем', desc: 'Последние лучи, танцующие на волнах.', quote: '«Каждый закат — обещание нового рассвета»' },
        { id: 17, cat: 'nature', title: 'Зимнее утро', desc: 'Иней на ветках, первый снег.', quote: '«Холодная магия»' },
        { id: 19, cat: 'nature', title: 'Водопад', desc: 'Сила и грация, вечное движение.', quote: '«Вода находит путь»' },
        { id: 20, cat: 'nature', title: 'Туман в долине', desc: 'Мистическое утро, где реальность размыта.', quote: '«Таинственность привлекает»' },
        { id: 21, cat: 'nature', title: 'Осенний парк', desc: 'Золотая листва, хрустящая под ногами.', quote: '«Осень — вторая весна»' },
        { id: 25, cat: 'nature', title: 'Горное озеро', desc: 'Кристально чистая вода, отражающая пики.', quote: '«Природа — лучший художник»' },
        { id: 26, cat: 'nature', title: 'Луг на закате', desc: 'Тёплый свет, ласкающий травы.', quote: '«Золотой час»' },
        { id: 27, cat: 'nature', title: 'Берег реки', desc: 'Спокойное течение, время замедляется.', quote: '«Река течёт внутри нас»' },
        { id: 28, cat: 'nature', title: 'Цветущий сад', desc: 'Весеннее буйство красок.', quote: '«Жизнь пробивается сквозь всё»' },
        { id: 29, cat: 'nature', title: 'Сосновый бор', desc: 'Запах смолы и тишина.', quote: '«Лес — это лёгкие планеты»' },
        { id: 30, cat: 'nature', title: 'Скалы на рассвете', desc: 'Первые лучи, окрашивающие камень.', quote: '«Вечность смотрит на нас»' },
        { id: 31, cat: 'nature', title: 'Болото в тумане', desc: 'Загадочный пейзаж, полный звуков.', quote: '«Тайны природы»' },
        { id: 32, cat: 'nature', title: 'Полярное сияние', desc: 'Небесный танец зелёного света.', quote: '«Магия высоких широт»' },
        
        { id: 5, cat: 'details', title: 'Текстура времени', desc: 'Ржавчина, трещины, потёртости. Время оставляет следы.', quote: '«Красота в несовершенстве»' },
        { id: 12, cat: 'details', title: 'Капля росы', desc: 'Микроскопический мир на лепестке.', quote: '«Целая вселенная в одной капле»' },
        { id: 22, cat: 'details', title: 'Старая дверь', desc: 'Ручка, помнящая тысячи прикосновений.', quote: '«Предметы хранят истории»' },
        { id: 23, cat: 'details', title: 'Паутина в углу', desc: 'Искусство терпения и геометрии.', quote: '«Природа — гениальный инженер»' },
        { id: 24, cat: 'details', title: 'Отражение в луже', desc: 'Искажённый мир, полный поэзии.', quote: '«Истина скрыта в отражениях»' }
    ];

    let currentCategory = 'all';
    let currentSpreadIndex = 0;
    let currentSpreads = [];

    // Группируем фото по два для разворотов
    function buildSpreads(photos) {
        const spreads = [];
        for (let i = 0; i < photos.length; i += 2) {
            const left = photos[i];
            const right = photos[i+1] || null;
            spreads.push({ left, right });
        }
        return spreads;
    }

    function filterByCategory(category) {
        if (category === 'all') return [...PHOTOS];
        return PHOTOS.filter(p => p.cat === category);
    }

    function renderSpreads() {
        const filtered = filterByCategory(currentCategory);
        currentSpreads = buildSpreads(filtered);
        currentSpreadIndex = 0;
        updateDisplay();
        document.getElementById('photoCountBadge').innerText = filtered.length + ' кадров';
    }

    function updateDisplay() {
        const container = document.getElementById('spreadsContainer');
        if (!container) return;
        
        if (currentSpreads.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding: 80px;">нет фотографий в этой категории</div>';
            document.getElementById('pageIndicator').innerText = 'страница 0 / 0';
            return;
        }
        
        const spread = currentSpreads[currentSpreadIndex];
        container.innerHTML = '';
        
        const spreadDiv = document.createElement('div');
        spreadDiv.className = 'spread active-spread';
        
        // левая страница (фото)
        if (spread.left) {
            const leftDiv = document.createElement('div');
            leftDiv.className = 'photo-page';
            const img = document.createElement('img');
            img.src = `images/${spread.left.id}.jpg`;
            img.alt = spread.left.title;
            leftDiv.appendChild(img);
            spreadDiv.appendChild(leftDiv);
        } else {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'photo-page';
            emptyDiv.style.background = '#f0f0e8';
            emptyDiv.style.display = 'flex';
            emptyDiv.style.alignItems = 'center';
            emptyDiv.style.justifyContent = 'center';
            emptyDiv.innerText = '✦';
            spreadDiv.appendChild(emptyDiv);
        }
        
        // правая страница (текст)
        if (spread.right) {
            const rightDiv = document.createElement('div');
            rightDiv.className = 'text-page';
            rightDiv.innerHTML = `
                <div class="meta">${spread.right.cat.toUpperCase()} / кадр ${spread.right.id}</div>
                <h2>${spread.right.title}</h2>
                <div class="description">${spread.right.desc}</div>
                <div class="quote">${spread.right.quote}</div>
            `;
            spreadDiv.appendChild(rightDiv);
        } else if (spread.left) {
            // если только одно фото на развороте, используем его текст
            const rightDiv = document.createElement('div');
            rightDiv.className = 'text-page';
            rightDiv.innerHTML = `
                <div class="meta">${spread.left.cat.toUpperCase()} / кадр ${spread.left.id}</div>
                <h2>${spread.left.title}</h2>
                <div class="description">${spread.left.desc}</div>
                <div class="quote">${spread.left.quote}</div>
            `;
            spreadDiv.appendChild(rightDiv);
        }
        
        container.appendChild(spreadDiv);
        
        const total = currentSpreads.length;
        document.getElementById('pageIndicator').innerText = `страница ${currentSpreadIndex+1} / ${total}`;
    }

    function nextSpread() {
        if (currentSpreads.length === 0) return;
        if (currentSpreadIndex + 1 < currentSpreads.length) {
            currentSpreadIndex++;
            updateDisplay();
        }
    }
    
    function prevSpread() {
        if (currentSpreads.length === 0) return;
        if (currentSpreadIndex - 1 >= 0) {
            currentSpreadIndex--;
            updateDisplay();
        }
    }

    // установка категории
    function setCategory(cat) {
        currentCategory = cat;
        renderSpreads();
        // обновить активный класс в TOC
        document.querySelectorAll('.toc-item').forEach(item => {
            if (item.dataset.cat === cat) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    // интро + запуск
    const introDiv = document.getElementById('intro');
    const magazineDiv = document.getElementById('magazine');
    
    introDiv.addEventListener('click', () => {
        introDiv.style.opacity = '0';
        setTimeout(() => {
            introDiv.style.display = 'none';
            magazineDiv.style.opacity = '1';
            renderSpreads();
        }, 800);
    });
    
    // события кнопок
    document.getElementById('prevSpread').addEventListener('click', prevSpread);
    document.getElementById('nextSpread').addEventListener('click', nextSpread);
    
    document.querySelectorAll('.toc-item').forEach(btn => {
        btn.addEventListener('click', () => {
            setCategory(btn.dataset.cat);
        });
    });
    
    // клавиши влево/вправо
    window.addEventListener('keydown', (e) => {
        if (magazineDiv.style.opacity === '1') {
            if (e.key === 'ArrowLeft') prevSpread();
            if (e.key === 'ArrowRight') nextSpread();
        }
    });
    
    // предзагрузка первых 10 фото
    for (let i = 0; i < Math.min(10, PHOTOS.length); i++) {
        const pre = new Image();
        pre.src = `images/${PHOTOS[i].id}.jpg`;
    }
</script>
</body>
</html>
