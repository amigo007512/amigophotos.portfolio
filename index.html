<!DOCTYPE html>
<html lang="ru">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y2D4VS5FRD"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-Y2D4VS5FRD');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Photos — фотопортфолио</title>
    
    <meta name="description" content="Фотопортфолио Amigo Photos. Стрит-фотография и пейзажи.">
    <meta name="keywords" content="фотография, портфолио, стрит-фотография, пейзажи, Amigo Photos">
    <meta name="author" content="Amigo Photos">
    <meta property="og:title" content="Amigo Photos — фотопортфолио">
    <meta property="og:description" content="Стрит-фотография и пейзажи. Моменты, сохранённые в кадре.">
    <meta property="og:image" content="https://амигоботов.portfolio/images/1.jpg">
    <meta property="og:type" content="website">
    
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📷</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0e0e0e;
            color: #fff;
        }
        
        /* Hero слайдер */
        .hero {
            height: 85vh;
            position: relative;
            overflow: hidden;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .hero h1 {
            font-size: 4em;
            margin: 0;
        }
        
        .hero p {
            margin-top: 15px;
            font-size: 1.2em;
        }
        
        /* Категории */
        .categories {
            padding: 30px 60px 0;
            text-align: center;
        }
        
        .category-btn {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 10px 24px;
            margin: 5px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .category-btn:hover {
            background: #444;
            transform: translateY(-2px);
        }
        
        .category-btn.active {
            background: #fff;
            color: #000;
        }
        
        /* Галерея */
        .gallery {
            display: grid;
            gap: 20px;
            padding: 40px 60px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
        
        .gallery-item {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .gallery-item:hover img {
            transform: scale(1.02);
        }
        
        /* Блок с лайком под фото */
        .like-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #1a1a1a;
        }
        
        .like-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 30px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .like-btn span {
            font-size: 18px;
            color: #fff;
        }
        
        .like-btn.liked {
            color: #ff4444;
        }
        
        .like-btn:not(.liked):hover {
            transform: scale(1.1);
        }
        
        .like-count {
            font-size: 16px;
            color: #fff;
            background: #2a2a2a;
            padding: 4px 12px;
            border-radius: 20px;
        }
        
        /* Лайтбокс */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        #lightbox img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 10px;
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            font-size: 40px;
            padding: 20px 15px;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 1001;
        }
        
        .lightbox-nav:hover {
            background: rgba(255,255,255,0.4);
        }
        
        .lightbox-prev {
            left: 20px;
        }
        
        .lightbox-next {
            right: 20px;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            background: none;
            border: none;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
        }
        
        /* Кнопка наверх */
        #toTop {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 18px;
            border-radius: 50px;
            cursor: pointer;
            display: none;
            z-index: 99;
        }
        
        /* Статистика */
        .stats {
            text-align: center;
            padding: 20px;
            background: #1a1a1a;
            margin: 20px 60px;
            border-radius: 50px;
            font-size: 14px;
        }
        
        .stats span {
            margin: 0 15px;
        }
        
        /* Адаптив */
        @media (max-width: 768px) {
            .hero {
                height: 60vh;
            }
            .hero h1 {
                font-size: 2em;
            }
            .hero p {
                font-size: 1em;
            }
            .gallery {
                grid-template-columns: repeat(2, 1fr);
                padding: 20px 12px;
                gap: 12px;
            }
            .gallery img {
                height: 170px;
            }
            .categories {
                padding: 20px 12px 0;
            }
            .category-btn {
                padding: 6px 16px;
                font-size: 12px;
            }
            .stats {
                margin: 20px 12px;
                font-size: 10px;
            }
            .stats span {
                margin: 0 8px;
            }
            .lightbox-nav {
                font-size: 25px;
                padding: 10px;
            }
            .like-btn {
                font-size: 20px;
            }
            .like-count {
                font-size: 14px;
            }
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 14px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="slide active" style="background-image: url('images/1.jpg');"></div>
    <div class="slide" style="background-image: url('images/2.jpg');"></div>
    <div class="slide" style="background-image: url('images/3.jpg');"></div>
    <div class="slide" style="background-image: url('images/4.jpg');"></div>
    <div class="slide" style="background-image: url('images/5.jpg');"></div>
    <div class="hero-content">
        <h1>Amigo Photos</h1>
        <p>Стрит-фотография и пейзажи</p>
        <p>Фотография — способ сохранить моменты</p>
    </div>
</section>

<div class="categories">
    <button class="category-btn active" data-category="all">Все</button>
    <button class="category-btn" data-category="street">Стрит</button>
    <button class="category-btn" data-category="landscape">Пейзажи</button>
    <button class="category-btn" data-category="portrait">Портреты</button>
</div>

<section class="gallery" id="gallery"></section>

<div id="lightbox">
    <button class="lightbox-close">✕</button>
    <button class="lightbox-nav lightbox-prev">❮</button>
    <button class="lightbox-nav lightbox-next">❯</button>
    <img src="">
</div>

<button id="toTop">↑ Наверх</button>

<div class="stats">
    <span>📸 Всего фото: <span id="totalCount">0</span></span>
    <span>👁️ Просмотров: <span id="viewCount">0</span></span>
    <span>❤️ Всего лайков: <span id="totalLikesCount">0</span></span>
</div>

<footer>
    © 2026 Amigo Photos — All Rights Reserved
</footer>

<script>
// Данные фото
const photosData = [
    { id: 1, src: 'images/1.jpg', category: 'street' },
    { id: 2, src: 'images/2.jpg', category: 'landscape' },
    { id: 3, src: 'images/3.jpg', category: 'portrait' },
    { id: 4, src: 'images/4.jpg', category: 'street' },
    { id: 5, src: 'images/5.jpg', category: 'landscape' },
    { id: 6, src: 'images/6.jpg', category: 'street' },
    { id: 7, src: 'images/7.jpg', category: 'portrait' },
    { id: 8, src: 'images/8.jpg', category: 'landscape' },
    { id: 9, src: 'images/9.jpg', category: 'street' },
    { id: 10, src: 'images/10.jpg', category: 'portrait' },
    { id: 11, src: 'images/11.jpg', category: 'street' },
    { id: 12, src: 'images/12.jpg', category: 'landscape' },
    { id: 13, src: 'images/13.jpg', category: 'street' },
    { id: 14, src: 'images/14.jpg', category: 'portrait' },
    { id: 15, src: 'images/15.jpg', category: 'landscape' },
    { id: 16, src: 'images/16.jpg', category: 'street' },
    { id: 17, src: 'images/17.jpg', category: 'portrait' },
    { id: 18, src: 'images/18.jpg', category: 'landscape' },
    { id: 19, src: 'images/19.jpg', category: 'street' },
    { id: 20, src: 'images/20.jpg', category: 'landscape' },
    { id: 21, src: 'images/21.jpg', category: 'street' },
    { id: 22, src: 'images/22.jpg', category: 'portrait' },
    { id: 23, src: 'images/23.jpg', category: 'street' }
];

// Загрузка сохранённых лайков из localStorage
let photoLikes = {};
for (let i = 1; i <= 23; i++) {
    const saved = localStorage.getItem(`like_${i}`);
    photoLikes[i] = saved ? parseInt(saved) : 0;
}

// Общая статистика
let views = localStorage.getItem('views') ? parseInt(localStorage.getItem('views')) : 0;

// Подсчёт общего количества лайков
function getTotalLikes() {
    let total = 0;
    for (let id in photoLikes) {
        total += photoLikes[id];
    }
    return total;
}

const galleryContainer = document.getElementById('gallery');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
let currentPhotoIndex = 0;

// Отрисовка галереи
function renderGallery(category = 'all') {
    const filtered = category === 'all' ? photosData : photosData.filter(p => p.category === category);
    
    const fragment = document.createDocumentFragment();
    
    filtered.forEach((photo) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        const img = document.createElement('img');
        img.src = photo.src;
        img.alt = `Фото ${photo.id}`;
        img.loading = 'lazy';
        
        img.addEventListener('click', () => {
            const globalIdx = photosData.findIndex(p => p.id === photo.id);
            openLightbox(globalIdx);
        });
        
        const likeBlock = document.createElement('div');
        likeBlock.className = 'like-block';
        
        const likeBtn = document.createElement('button');
        likeBtn.className = 'like-btn';
        const isLiked = photoLikes[photo.id] > 0;
        likeBtn.innerHTML = isLiked ? '❤️ <span>Лайкнут</span>' : '🤍 <span>Лайкнуть</span>';
        if (isLiked) likeBtn.classList.add('liked');
        
        const likeCountSpan = document.createElement('span');
        likeCountSpan.className = 'like-count';
        likeCountSpan.textContent = `❤️ ${photoLikes[photo.id]}`;
        
        likeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // Можно лайкнуть только один раз
            if (photoLikes[photo.id] === 0) {
                photoLikes[photo.id] = 1;
                localStorage.setItem(`like_${photo.id}`, 1);
                likeBtn.innerHTML = '❤️ <span>Лайкнут</span>';
                likeBtn.classList.add('liked');
                likeCountSpan.textContent = `❤️ 1`;
                document.getElementById('totalLikesCount').textContent = getTotalLikes();
                
                // Анимация сердечка
                const heart = document.createElement('div');
                heart.textContent = '❤️';
                heart.style.position = 'fixed';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                heart.style.fontSize = '30px';
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '9999';
                heart.style.animation = 'fadeOut 1s ease-out';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        });
        
        likeBlock.appendChild(likeBtn);
        likeBlock.appendChild(likeCountSpan);
        
        item.appendChild(img);
        item.appendChild(likeBlock);
        fragment.appendChild(item);
    });
    
    galleryContainer.innerHTML = '';
    galleryContainer.appendChild(fragment);
}

// Открытие лайтбокса
function openLightbox(index) {
    currentPhotoIndex = index;
    lightboxImg.src = photosData[currentPhotoIndex].src;
    lightbox.style.display = 'flex';
    
    views++;
    localStorage.setItem('views', views);
    document.getElementById('viewCount').textContent = views;
}

function closeLightbox() {
    lightbox.style.display = 'none';
}

function prevPhoto() {
    currentPhotoIndex = (currentPhotoIndex - 1 + photosData.length) % photosData.length;
    lightboxImg.src = photosData[currentPhotoIndex].src;
}

function nextPhoto() {
    currentPhotoIndex = (currentPhotoIndex + 1) % photosData.length;
    lightboxImg.src = photosData[currentPhotoIndex].src;
}

// Слайдер
let currentSlide = 0;
const slides = document.querySelectorAll('.slide');
let slideInterval;

function startSlider() {
    slideInterval = setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 5000);
}

startSlider();

// Категории
const categoryBtns = document.querySelectorAll('.category-btn');
categoryBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        categoryBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.getAttribute('data-category'));
    });
});

// Кнопка наверх
const toTop = document.getElementById('toTop');
let scrollTimeout;

window.addEventListener('scroll', () => {
    if (scrollTimeout) return;
    scrollTimeout = setTimeout(() => {
        toTop.style.display = window.scrollY > 300 ? 'block' : 'none';
        scrollTimeout = null;
    }, 50);
});

toTop.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
});

// Анимация сердечка
const style = document.createElement('style');
style.textContent = `
    @keyframes fadeOut {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.5); }
    }
`;
document.head.appendChild(style);

// Инициализация
renderGallery();
document.getElementById('totalCount').textContent = photosData.length;
document.getElementById('viewCount').textContent = views;
document.getElementById('totalLikesCount').textContent = getTotalLikes();

// Лайтбокс события
document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
document.querySelector('.lightbox-prev').addEventListener('click', prevPhoto);
document.querySelector('.lightbox-next').addEventListener('click', nextPhoto);
lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
    if (lightbox.style.display === 'flex') {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevPhoto();
        if (e.key === 'ArrowRight') nextPhoto();
    }
});
</script>

</body>
</html>
